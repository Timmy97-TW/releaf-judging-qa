<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Map · ReLEAF Judging Trainer</title>
<meta name="description" content="Three shells in 3D: evidence on the rim, the concepts that connect domains, impact at the core. Figures on the left, the map in the middle, the card on the right.">
<link rel="stylesheet" href="assets/css/base.css?v=202610292100">
<link rel="stylesheet" href="assets/css/pages.css?v=202610292100">
<link rel="stylesheet" href="assets/css/theme.css?v=202610292100">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%2300B87A'/%3E%3C/svg%3E">
<style>
body { overflow-x: hidden; }
.full { width: 100%; padding: 0 16px 16px; }

.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 14px 4px 10px; }
.top h1 { font-size: 21px; font-weight: 700; margin: 0; }
.top p { font-size: 13.5px; color: var(--muted); margin: 0; }

/* filter bar: a thin strip that opens on hover ------------------------ */
.fbar { position: relative; z-index: 30; height: 34px; margin: 0 4px 10px; }
.fbar-head {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 14px;
  background: #fff; border: 1px solid var(--rule); border-radius: 999px;
  font-size: 12.5px; color: var(--muted); cursor: default; width: fit-content;
  transition: border-color .18s, box-shadow .18s;
}
.fbar:hover .fbar-head, .fbar.pin .fbar-head { border-color: var(--navy); box-shadow: 0 2px 10px rgba(0, 6, 28, .08); }
.fbar-head b { font-weight: 700; color: var(--ink); letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
.fbar-head .tally { font-variant-numeric: tabular-nums; }
.fbar-head .live { display: flex; gap: 5px; flex-wrap: wrap; }
.fbar-head .live span { background: var(--navy); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; }
.fbar-head .caret { margin-left: 2px; color: var(--faint); font-size: 11px; }
.fbar-body {
  position: absolute; top: 38px; left: 0; right: 0;
  background: #fff; border: 1px solid var(--rule); border-radius: 18px; padding: 10px 16px;
  box-shadow: 0 16px 40px rgba(0, 6, 28, .13);
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity .2s, transform .2s, visibility .2s;
}
.fbar:hover .fbar-body, .fbar:focus-within .fbar-body, .fbar.pin .fbar-body { opacity: 1; visibility: visible; transform: none; }
.frow { display: flex; align-items: center; gap: 10px; padding: 7px 0; flex-wrap: wrap; }
.frow + .frow { border-top: 1px solid var(--rule-soft); }
.frow > span.lab { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); width: 108px; flex: none; }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.fc { font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; background: #fff;
      border: 1px solid var(--rule); color: var(--ink-2); border-radius: 999px; padding: 5px 11px;
      display: inline-flex; align-items: center; gap: 6px; transition: background .18s, border-color .18s, color .18s; }
.fc i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: block; }
.fc:hover { border-color: rgba(0, 0, 0, .25); }
.fc.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.fc.on.tint { background: var(--t); border-color: var(--t); color: #fff; }
.fclear { font: inherit; font-size: 12.5px; font-weight: 600; background: none; border: 0; color: var(--jb-blue); cursor: pointer; }

/* three columns ------------------------------------------------------- */
.stage { display: grid; grid-template-columns: 290px minmax(0, 1fr) 380px; gap: 14px;
         height: calc(100dvh - var(--nav-h, 60px) - 118px); min-height: 520px; }
.col { min-width: 0; min-height: 0; }
.scroller { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.scroller::-webkit-scrollbar { width: 8px; }
.scroller::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .14); border-radius: 8px; }

.chead { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
         color: var(--faint); padding: 0 2px 8px; }
.shot { margin-bottom: 10px; }
.shot img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-radius: 16px;
            background: #fff; border: 1px solid var(--rule); cursor: zoom-in; transition: border-color .2s, transform .2s; }
.shot img:hover { border-color: var(--navy); transform: translateY(-2px); }
.shot p { font-size: 12px; color: var(--muted); margin: 6px 2px 0; line-height: 1.45; }
.lcard { background: #fff; border: 1px solid var(--rule); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
.lcard i { font-style: normal; display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
.lcard b { display: block; font-size: 14px; font-weight: 600; line-height: 1.45; font-variant-numeric: tabular-nums; }
.lcard.hold { border-left: 3px solid var(--jb-green); }
.lcard.fail { border-left: 3px solid var(--jb-amber); }
.lhint { font-size: 13.5px; color: var(--muted); line-height: 1.6; padding: 0 2px; }

.board { position: relative; height: 100%; border-radius: var(--r-lg); overflow: hidden;
         background: var(--navy); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09); }
.board::before, .board::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; pointer-events: none; }
.board::before { width: 44%; height: 62%; left: -10%; top: -18%; background: radial-gradient(circle, #0167EF 0%, transparent 65%); }
.board::after { width: 42%; height: 60%; right: -9%; bottom: -20%; background: radial-gradient(circle, #00B87A 0%, transparent 65%); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#cv.drag { cursor: grabbing; }
.hub { position: absolute; left: 16px; bottom: 12px; z-index: 3; font-size: 11.5px; color: rgba(255, 255, 255, .4); pointer-events: none; margin: 0; }
.spin { position: absolute; right: 14px; top: 12px; z-index: 3; font: inherit; font-size: 11.5px; font-weight: 600;
        background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .17); color: #fff;
        border-radius: 999px; padding: 5px 13px; cursor: pointer; }

.mpanel { background: #fff; border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 18px; }
.mtag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; margin-bottom: 10px; }
.mpanel h2 { font-size: 19px; font-weight: 700; line-height: 1.32; margin: 0 0 12px; }
.spans { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.spans span { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--paper-2); color: var(--faint); }
.mnum { background: var(--paper-2); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.mnum b { display: block; font-size: 15px; font-weight: 600; line-height: 1.45; }
.mnum span { display: block; font-size: 13px; color: var(--muted); margin-top: 5px; }
.links { border-top: 1px solid var(--rule); margin-top: 6px; padding-top: 10px; }
.links h3 { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
.lk { display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0; border-radius: 12px; padding: 9px 10px; cursor: pointer; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
.lk:hover { background: var(--paper-2); }
.lk b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.lk b::before { content: "→ "; color: var(--faint); }
.wk { display: inline-block; margin-top: 10px; font-size: 13.5px; font-weight: 600; }
.mhint { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }

#lb { position: fixed; inset: 0; z-index: 200; background: rgba(0, 6, 28, .93); display: none; align-items: center; justify-content: center; padding: 28px; cursor: zoom-out; }
#lb.on { display: flex; }
#lb img { max-width: 92vw; max-height: 82vh; border-radius: 14px; display: block; }
#lb p { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; color: rgba(255, 255, 255, .72); font-size: 14px; padding: 0 24px; margin: 0; }

@media (max-width: 1180px) { .stage { grid-template-columns: 240px minmax(0, 1fr) 330px; } }
@media (max-width: 980px) {
  .stage { grid-template-columns: 1fr; height: auto; }
  .board { height: 440px; }
  .scroller { height: auto; overflow: visible; }
  .col-figs { order: 3; }
  .col-card { order: 2; }
  .frow > span.lab { width: 100%; }
  .fbar-body { position: static; opacity: 1; visibility: visible; transform: none; box-shadow: none; margin-top: 8px; }
  .fbar { height: auto; }
}
</style>
</head>
<body>

<div class="full">
  <div class="top">
    <h1 data-en="Knowledge map" data-zh="知識地圖"></h1>
    <p data-en="Sixty nodes on three shells. Drag to turn it. Figures on the left, the card on the right."
       data-zh="三層殼、六十個節點。拖曳可以轉動。圖在左邊，卡片在右邊。"></p>
  </div>

  <div class="fbar" id="fbar">
    <div class="fbar-head">
      <b data-en="Filter" data-zh="篩選"></b>
      <span class="tally" id="fcount"></span>
      <span class="live" id="flive"></span>
      <span class="caret">▾</span>
    </div>
    <div class="fbar-body">
      <div class="frow"><span class="lab" data-en="Domain" data-zh="領域"></span><div class="fchips" id="f-dom"></div></div>
      <div class="frow"><span class="lab" data-en="Evidence for" data-zh="支持哪個獎"></span><div class="fchips" id="f-aw"></div></div>
      <div class="frow"><span class="lab" data-en="How strong" data-zh="證據強度"></span><div class="fchips" id="f-st"></div></div>
      <div class="frow">
        <span class="lab" data-en="Lens" data-zh="鏡頭"></span>
        <div class="fchips" id="f-lens"></div>
        <button class="fclear" id="fclear" data-en="Clear all" data-zh="全部清除"></button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="col col-figs">
      <div class="scroller" id="figs"></div>
    </div>

    <div class="col">
      <div class="board" id="board">
        <canvas id="cv"></canvas>
        <button class="spin" id="spin" data-en="Pause" data-zh="暫停"></button>
        <p class="hub" id="hub"></p>
      </div>
    </div>

    <div class="col col-card">
      <div class="scroller"><aside class="mpanel" id="panel"></aside></div>
    </div>
  </div>
</div>

<div id="lb" role="dialog" aria-modal="true"><img alt=""><p></p></div>

<script src="assets/js/site.js?v=202610292100"></script>
<script src="data/map.js?v=202610292100"></script>
<script>
(function () {
  var S = window.Site;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var board = document.getElementById('board'), figs = document.getElementById('figs');
  var panel = document.getElementById('panel'), lb = document.getElementById('lb');
  var R = { ev: 1, con: .56, imp: .2 };
  var NODES = MAP_NODES, byId = {}, DOM = {}, i, n;

  for (i = 0; i < MAP_DOMS.length; i++) DOM[MAP_DOMS[i].id] = MAP_DOMS[i];
  for (i = 0; i < NODES.length; i++) {
    n = NODES[i]; byId[n.id] = n;
    var lon = (n.lon !== undefined ? n.lon : (DOM[n.dom] ? DOM[n.dom].lon : 0)) * Math.PI / 180;
    var lat = (n.lat || 0) * Math.PI / 180, r = R[n.k];
    n.p0 = [r * Math.cos(lat) * Math.sin(lon), r * Math.sin(lat), r * Math.cos(lat) * Math.cos(lon)];
    n.cur = n.p0.slice();
    n.col = n.k === 'ev' ? (DOM[n.dom] ? DOM[n.dom].c : '#fff') : (n.k === 'con' ? '#9FE8FF' : '#FFFFFF');
    n.nb = []; n.fx = (n.k === 'ev' ? MAP_FACETS[n.id] : null) || null;
  }
  var LINKS = [];
  for (i = 0; i < MAP_EDGES.length; i++) {
    var e = MAP_EDGES[i], a = byId[e[0]], b = byId[e[1]];
    if (!a || !b) continue;
    var rec = { a: a, b: b, en: e[2], zh: e[3] };
    LINKS.push(rec); a.nb.push(rec); b.nb.push(rec);
  }

  function L(o, k) { return (S.lang === 'zh' && o[k + '_zh']) ? o[k + '_zh'] : (o[k] || ''); }
  function title(o) { return S.lang === 'zh' ? (o.zh || o.en) : o.en; }
  function zh() { return S.lang === 'zh'; }

  /* ---------------------------------------------------------- filters */
  var F = { dom: {}, aw: {}, st: {}, risk: false };
  function anyOn(g) { for (var k in g) if (g[k]) return true; return false; }
  function pass(nd) {
    if (nd.k !== 'ev') return true;
    if (anyOn(F.dom) && !F.dom[nd.dom]) return false;
    var fx = nd.fx || {};
    if (anyOn(F.aw)) {
      var ok = false, aw = fx.aw || [];
      for (var j = 0; j < aw.length; j++) if (F.aw[aw[j]]) ok = true;
      if (!ok) return false;
    }
    if (anyOn(F.st) && !F.st[fx.st]) return false;
    if (F.risk && !fx.rk) return false;
    return true;
  }

  function chips() {
    var h = '', d, j;
    for (j = 0; j < MAP_DOMS.length; j++) {
      d = MAP_DOMS[j];
      h += '<button class="fc tint' + (F.dom[d.id] ? ' on' : '') + '" style="--t:' + d.c + ';color:' +
        (F.dom[d.id] ? '#fff' : d.c) + '" data-g="dom" data-v="' + d.id + '"><i></i>' + S.esc(zh() ? d.zh : d.en) + '</button>';
    }
    document.getElementById('f-dom').innerHTML = h;
    h = '';
    for (j = 0; j < MAP_AWARDS.length; j++) {
      d = MAP_AWARDS[j];
      h += '<button class="fc' + (F.aw[d.id] ? ' on' : '') + '" data-g="aw" data-v="' + d.id + '">' + S.esc(zh() ? d.zh : d.en) + '</button>';
    }
    document.getElementById('f-aw').innerHTML = h;
    h = '';
    for (j = 0; j < MAP_STRENGTH.length; j++) {
      d = MAP_STRENGTH[j];
      h += '<button class="fc' + (F.st[d.id] ? ' on' : '') + '" data-g="st" data-v="' + d.id + '">' + S.esc(zh() ? d.zh : d.en) + '</button>';
    }
    document.getElementById('f-st').innerHTML = h;
    document.getElementById('f-lens').innerHTML =
      '<button class="fc' + (F.risk ? ' on' : '') + '" data-g="risk" data-v="1">' +
      S.esc(zh() ? '評審一挖就會找到的' : 'A judge who digs lands here') + '</button>';
    summary();
  }

  function summary() {
    var tot = 0, vis = 0, j;
    for (j = 0; j < NODES.length; j++) if (NODES[j].k === 'ev') { tot++; if (pass(NODES[j])) vis++; }
    document.getElementById('fcount').textContent = (zh() ? '顯示 ' : 'showing ') + vis + ' / ' + tot;
    var live = [];
    for (j = 0; j < MAP_DOMS.length; j++) if (F.dom[MAP_DOMS[j].id]) live.push(zh() ? MAP_DOMS[j].zh : MAP_DOMS[j].en);
    for (j = 0; j < MAP_AWARDS.length; j++) if (F.aw[MAP_AWARDS[j].id]) live.push(zh() ? MAP_AWARDS[j].zh : MAP_AWARDS[j].en);
    for (j = 0; j < MAP_STRENGTH.length; j++) if (F.st[MAP_STRENGTH[j].id]) live.push(zh() ? MAP_STRENGTH[j].zh : MAP_STRENGTH[j].en);
    if (F.risk) live.push(zh() ? '一挖就找到' : 'judges land here');
    var h = '';
    for (j = 0; j < live.length; j++) h += '<span>' + S.esc(live[j]) + '</span>';
    document.getElementById('flive').innerHTML = h;
  }

  var fbar = document.getElementById('fbar');
  fbar.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-g]');
    if (!b) { if (ev.target.closest('.fbar-head')) fbar.classList.toggle('pin'); return; }
    var g = b.getAttribute('data-g'), v = b.getAttribute('data-v');
    if (g === 'risk') F.risk = !F.risk; else F[g][v] = !F[g][v];
    chips();
    if (sel && !pass(sel)) select(null);
  });
  document.getElementById('fclear').addEventListener('click', function (ev) {
    ev.stopPropagation(); F = { dom: {}, aw: {}, st: {}, risk: false }; chips();
  });

  /* ---------------------------------------------------------- 3D */
  var yaw = -0.5, pitch = -0.22, yawT = yaw, pitchT = pitch;
  var spin = true, sel = null, hov = null, near = {};
  var W = 0, H = 0, dpr = 1, cxp = 0, cyp = 0, unit = 1;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    if (!W || !H) return;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cxp = W / 2; cyp = H / 2;
    unit = Math.min(W * 0.40, H * 0.42);
  }

  function project(p) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    var x = p[0] * cy - p[2] * sy, z = p[0] * sy + p[2] * cy, y = p[1];
    var y2 = y * cp - z * sp, z2 = y * sp + z * cp;
    var f = 3.1, s = f / (f - z2);
    return [cxp + x * unit * s, cyp - y2 * unit * s, z2, s];
  }
  function visible(nd) { return pass(nd); }

  function step() {
    var j, k, t;
    for (j = 0; j < NODES.length; j++) {
      var nd = NODES[j], push = 1;
      if (sel && !near[nd.id]) push = 1.45;
      else if (sel && nd !== sel) push = .9;
      for (k = 0; k < 3; k++) { t = nd.p0[k] * push; nd.cur[k] += (t - nd.cur[k]) * 0.085; }
    }
    if (sel) {
      var d = yawT - yaw;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      yaw += d * 0.07; pitch += (pitchT - pitch) * 0.07;
    } else if (spin && !drag) { yaw += 0.0013; }
  }

  function overlaps(r, list) {
    for (var j = 0; j < list.length; j++) {
      var o = list[j];
      if (r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y) return true;
    }
    return false;
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    var j, nd, pr;
    for (j = 0; j < NODES.length; j++) NODES[j].pr = project(NODES[j].cur);

    for (j = 0; j < LINKS.length; j++) {
      var kk = LINKS[j], A = kk.a, B = kk.b;
      if (!visible(A) || !visible(B)) continue;
      var on = sel && (A === sel || B === sel);
      var zz = (A.pr[2] + B.pr[2]) / 2;
      var al = (0.10 + 0.14 * (zz + 1) / 2) * (sel ? (on ? 6 : .2) : 1);
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(al, .85) + ')';
      ctx.lineWidth = on ? 1.7 : 0.8;
      ctx.beginPath(); ctx.moveTo(A.pr[0], A.pr[1]); ctx.lineTo(B.pr[0], B.pr[1]); ctx.stroke();
    }

    var ord = NODES.slice().sort(function (a, b) { return a.pr[2] - b.pr[2]; });
    for (j = 0; j < ord.length; j++) {
      nd = ord[j]; pr = nd.pr;
      if (!visible(nd)) continue;
      var base = nd.k === 'ev' ? 5 : (nd.k === 'con' ? 8.5 : 7);
      var rr = base * pr[3];
      var depth = 0.45 + 0.55 * (pr[2] + 1) / 2;
      var a = depth * (sel ? (near[nd.id] ? 1 : .15) : 1);
      if (nd === hov) a = 1;
      ctx.globalAlpha = a;
      if (nd === sel) {
        ctx.beginPath(); ctx.arc(pr[0], pr[1], rr + 7, 0, 6.2832);
        ctx.strokeStyle = nd.col; ctx.lineWidth = 1.4; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(pr[0], pr[1], rr, 0, 6.2832);
      ctx.fillStyle = nd.col; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,6,28,.75)'; ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* labels last, front first, and never on top of one another */
    var placed = [];
    var lab = NODES.filter(function (x) { return x.k !== 'ev' && visible(x); })
      .sort(function (a, b) { return b.pr[2] - a.pr[2]; });
    for (j = 0; j < lab.length; j++) {
      nd = lab[j]; pr = nd.pr;
      if (pr[2] < -0.12 && nd !== sel && !near[nd.id]) continue;
      var txt = title(nd);
      var fs = Math.max(11, (nd.k === 'imp' ? 13 : 12.5) * pr[3]);
      ctx.font = (nd.k === 'imp' ? '600 ' : '500 ') + fs + 'px -apple-system, "PingFang TC", sans-serif';
      var w = ctx.measureText(txt).width;
      var yy = pr[1] - (nd.k === 'ev' ? 5 : nd.k === 'con' ? 8.5 : 7) * pr[3] - 8;
      var box = { x: pr[0] - w / 2 - 4, y: yy - fs, w: w + 8, h: fs + 6 };
      if (box.x < 2 || box.x + box.w > W - 2) continue;
      if (overlaps(box, placed) && nd !== sel) continue;
      placed.push(box);
      ctx.globalAlpha = (0.45 + 0.55 * (pr[2] + 1) / 2) * (sel ? (near[nd.id] ? 1 : .2) : .95);
      ctx.fillStyle = nd.k === 'imp' ? '#FFFFFF' : 'rgba(216,244,255,.96)';
      ctx.textAlign = 'center';
      ctx.fillText(txt, pr[0], yy);
      ctx.globalAlpha = 1;
    }

    if (hov && hov.k === 'ev' && visible(hov) && hov !== sel) {
      var t2 = title(hov), x = hov.pr[0], y = hov.pr[1];
      ctx.font = '500 12.5px -apple-system, "PingFang TC", sans-serif';
      var tw = Math.min(ctx.measureText(t2).width + 20, W - 24);
      var bx = x + 13, by = y - 14;
      if (bx + tw > W - 6) bx = Math.max(6, x - 13 - tw);
      ctx.fillStyle = 'rgba(0,6,28,.94)';
      ctx.beginPath(); ctx.roundRect(bx, by, tw, 27, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
      ctx.fillText(t2, bx + 10, by + 18, tw - 20);
    }
  }

  function tick() { step(); draw(); requestAnimationFrame(tick); }

  var drag = false, lx = 0, ly = 0, moved = 0;
  cv.addEventListener('pointerdown', function (e) {
    drag = true; moved = 0; lx = e.clientX; ly = e.clientY;
    cv.classList.add('drag');
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', function (e) {
    var rc = cv.getBoundingClientRect();
    if (drag) {
      var dx = e.clientX - lx, dy = e.clientY - ly;
      moved += Math.abs(dx) + Math.abs(dy);
      yaw += dx * 0.006; pitch = Math.max(-1.1, Math.min(1.1, pitch + dy * 0.005));
      yawT = yaw; pitchT = pitch; lx = e.clientX; ly = e.clientY; return;
    }
    hov = pick(e.clientX - rc.left, e.clientY - rc.top);
    cv.style.cursor = hov ? 'pointer' : 'grab';
  });
  cv.addEventListener('pointerup', function (e) {
    drag = false; cv.classList.remove('drag');
    if (moved < 6) { var rc = cv.getBoundingClientRect(); select(pick(e.clientX - rc.left, e.clientY - rc.top)); }
  });
  cv.addEventListener('pointerleave', function () { hov = null; });

  function pick(mx, my) {
    var best = null, bd = 20;
    for (var j = 0; j < NODES.length; j++) {
      var nd = NODES[j];
      if (!nd.pr || !visible(nd)) continue;
      var d = Math.hypot(nd.pr[0] - mx, nd.pr[1] - my);
      var lim = Math.max((nd.k === 'ev' ? 12 : 15) * nd.pr[3], 10);
      if (d < lim && d < bd) { bd = d; best = nd; }
    }
    return best;
  }

  /* ---------------------------------------------------------- left column */
  var TEASE = ['C_MEM', 'M_SIO2', 'P_LADDER', 'I_BROPHY', 'H_LOOP', 'D_TWIN', 'B_GEO', 'W_L2'];

  function leftColumn(nd) {
    var h = '', j;
    if (!nd) {
      h = '<p class="chead">' + (zh() ? '從這裡開始' : 'Start anywhere') + '</p>' +
        '<p class="lhint">' + (zh()
          ? '點地圖上任一個節點：它的圖會排在這一欄，數字與邊界在右邊。或直接點下面任何一張圖。'
          : 'Tap any node on the map: its figures stack here and its numbers sit on the right. Or just tap a picture below.') + '</p>';
      for (j = 0; j < TEASE.length; j++) {
        var t = byId[TEASE[j]];
        if (!t || !t.img || !t.img.length || !pass(t)) continue;
        h += '<div class="shot"><img loading="lazy" src="assets/img/' + t.img[0] + '" alt="" data-go="' + t.id + '">' +
          '<p>' + S.esc(title(t)) + '</p></div>';
      }
      figs.innerHTML = h;
      return;
    }
    h = '<p class="chead">' + (zh() ? '這個節點的圖' : 'Figures for this node') + '</p>';
    var im = (nd.img || []).slice(0, 4);
    for (j = 0; j < im.length; j++) {
      h += '<div class="shot"><img loading="lazy" src="assets/img/' + im[j] + '" alt="" data-full="assets/img/' + im[j] + '"></div>';
    }
    if (nd.k === 'ev') {
      h += '<p class="chead" style="padding-top:6px">' + (zh() ? '這個節點的數字' : 'The numbers') + '</p>';
      h += '<div class="lcard"><i>' + (zh() ? '數字' : 'the number') + '</i><b>' + S.esc(L(nd, 'num')) + '</b></div>';
      h += '<div class="lcard"><i>n</i><b>' + S.esc(L(nd, 'n')) + '</b></div>';
      h += '<div class="lcard"><i>' + (zh() ? '對照' : 'control') + '</i><b>' + S.esc(L(nd, 'ctl')) + '</b></div>';
      h += '<div class="lcard hold"><i>' + (zh() ? '成立' : 'holds') + '</i><b>' + S.esc(L(nd, 'hold')) + '</b></div>';
      h += '<div class="lcard fail"><i>' + (zh() ? '失敗在哪' : 'fails') + '</i><b>' + S.esc(L(nd, 'fail')) + '</b></div>';
    } else {
      h += '<div class="lcard"><i>' + (zh() ? '為什麼重要' : 'why it matters') + '</i><b>' + S.esc(L(nd, 'note')) + '</b></div>';
    }
    figs.innerHTML = h;
    figs.scrollTop = 0;
  }

  /* ---------------------------------------------------------- right column */
  function card(nd) {
    var isEv = nd.k === 'ev', j;
    var col = isEv ? DOM[nd.dom].c : (nd.k === 'con' ? '#0A1433' : '#00061C');
    var kind = isEv ? (zh() ? DOM[nd.dom].zh : DOM[nd.dom].en)
      : nd.k === 'con' ? (zh() ? '概念' : 'Concept') : (zh() ? '影響' : 'Impact');
    var h = '<span class="mtag" style="background:' + col + '1f;color:' + col + '">' + S.esc(kind) + '</span>';
    h += '<h2>' + S.esc(title(nd)) + '</h2>';

    if (isEv) {
      var fx = nd.fx || {}, st = '';
      for (j = 0; j < MAP_STRENGTH.length; j++) if (MAP_STRENGTH[j].id === fx.st) st = zh() ? MAP_STRENGTH[j].zh : MAP_STRENGTH[j].en;
      h += '<div class="spans"><span style="background:' + col + ';color:#fff">' + S.esc(st) + '</span>';
      for (j = 0; j < MAP_AWARDS.length; j++) if ((fx.aw || []).indexOf(MAP_AWARDS[j].id) >= 0)
        h += '<span>' + S.esc(zh() ? MAP_AWARDS[j].zh : MAP_AWARDS[j].en) + '</span>';
      if (fx.rk) h += '<span style="background:#FDF1E0;color:#A85B00">' + (zh() ? '一挖就會找到' : 'judges land here') + '</span>';
      h += '</div>';
    } else {
      if (nd.k === 'con') {
        var ds = {}, cnt = 0;
        for (j = 0; j < nd.nb.length; j++) {
          var o = nd.nb[j].a === nd ? nd.nb[j].b : nd.nb[j].a;
          if (o.k === 'ev' && !ds[o.dom]) { ds[o.dom] = 1; cnt++; }
        }
        var sp = '<div class="spans">';
        for (j = 0; j < MAP_DOMS.length; j++) {
          var d = MAP_DOMS[j], on = !!ds[d.id];
          sp += '<span' + (on ? ' style="background:' + d.c + ';color:#fff"' : '') + '>' + S.esc(zh() ? d.zh : d.en) + '</span>';
        }
        h += sp + '</div>';
        h += '<div class="mnum"><b>' + (zh() ? '橫跨 ' + cnt + ' 個領域' : 'Spans ' + cnt + ' domains') + '</b><span>' + S.esc(L(nd, 'note')) + '</span></div>';
      } else {
        h += '<div class="mnum"><b>' + S.esc(L(nd, 'note')) + '</b></div>';
      }
    }

    var ls = nd.nb.filter(function (k) { return (k.en || k.zh) && pass(k.a) && pass(k.b); });
    if (ls.length) {
      h += '<div class="links"><h3>' + (zh() ? '被寫下的連結' : 'Authored links') + '</h3>';
      for (j = 0; j < ls.length; j++) {
        var k2 = ls[j], ot = k2.a === nd ? k2.b : k2.a;
        var txt = zh() ? (k2.zh || k2.en) : k2.en;
        if (!txt) continue;
        h += '<button class="lk" data-go="' + ot.id + '"><b>' + S.esc(title(ot)) + '</b>' + S.esc(txt) + '</button>';
      }
      h += '</div>';
    }
    if (nd.pg) h += '<a class="wk" href="' + S.wiki(nd.pg) + '" target="_blank" rel="noopener">' +
      (zh() ? '到 wiki 看這一頁 ↗' : 'Open this wiki page ↗') + '</a>';
    return h;
  }

  function empty() {
    return '<p class="mhint">' + (zh()
      ? '點任一個節點：不相關的節點會讓開，地圖會把它轉到正面，它的圖與數字排到左邊，連結列在這裡。'
      : 'Tap any node: the unrelated ones move out of the way, the map turns it to the front, its figures and numbers stack on the left, and its links land here.') + '</p>';
  }

  function select(nd) {
    sel = nd && pass(nd) ? nd : null;
    near = {};
    if (sel) {
      near[sel.id] = 1;
      for (var j = 0; j < sel.nb.length; j++) { near[sel.nb[j].a.id] = 1; near[sel.nb[j].b.id] = 1; }
      var p = sel.p0;
      yawT = Math.atan2(p[0], p[2]);
      var zr = Math.sqrt(p[0] * p[0] + p[2] * p[2]);
      pitchT = Math.max(-1.0, Math.min(1.0, Math.atan2(p[1], zr || 0.001)));
    }
    leftColumn(sel);
    panel.innerHTML = sel ? card(sel) : empty();
    try { history.replaceState(null, '', sel ? '?n=' + sel.id : location.pathname); } catch (err) {}
  }

  function openLb(src) {
    lb.querySelector('img').src = src;
    lb.querySelector('p').textContent = sel ? title(sel) : '';
    lb.classList.add('on');
  }
  figs.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) { select(byId[go.getAttribute('data-go')]); return; }
    var im = e.target.closest('img[data-full]'); if (im) openLb(im.getAttribute('data-full'));
  });
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (b) select(byId[b.getAttribute('data-go')]);
  });
  lb.addEventListener('click', function () { lb.classList.remove('on'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (lb.classList.contains('on')) lb.classList.remove('on'); else select(null); }
  });

  var sb = document.getElementById('spin');
  sb.addEventListener('click', function () {
    spin = !spin;
    sb.setAttribute('data-en', spin ? 'Pause' : 'Spin');
    sb.setAttribute('data-zh', spin ? '暫停' : '旋轉');
    S.applyStatic(sb.parentNode);
  });

  function hub() {
    document.getElementById('hub').innerHTML = zh()
      ? '外層 · 證據 &nbsp;·&nbsp; 中層 · 概念 &nbsp;·&nbsp; 核心 · 影響'
      : 'outer · evidence &nbsp;·&nbsp; middle · concepts &nbsp;·&nbsp; core · impact';
  }

  S.onLang(function () { chips(); hub(); leftColumn(sel); panel.innerHTML = sel ? card(sel) : empty(); });
  window.addEventListener('resize', size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(board);

  size(); chips(); hub();
  var q = (location.search.match(/[?&]n=([^&]+)/) || [])[1];
  select(q && byId[q] ? byId[q] : null);
  tick();
})();
</script>
</body>
</html>
