<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Map · ReLEAF Judging Trainer</title>
<meta name="description" content="Evidence, the concepts that join domains, and impact — three shells in 3D, with every node's figures, numbers and boundary one tap away.">
<link rel="stylesheet" href="assets/css/base.css?v=202610311557">
<link rel="stylesheet" href="assets/css/pages.css?v=202610311557">
<link rel="stylesheet" href="assets/css/theme.css?v=202610311557">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%2300B87A'/%3E%3C/svg%3E">
<style>
html, body { height: 100%; }
body { overflow: hidden; }
/* this page is an app view: the shared footer would push the columns off-screen */
body > .foot, body > footer { display: none; }
.full { height: calc(100dvh - var(--nav-h, 60px)); display: flex; flex-direction: column;
        padding: 0 16px 14px; gap: 10px; }

/* header + the filters that never hide ------------------------------- */
.hdr { display: flex; align-items: center; gap: 16px; padding: 10px 4px 0; flex: none; }
/* one line when it fits: domain chips (they are also the colour key), then the award chips */
.fsets { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; }
.mrow { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mrow > .lab { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
               color: var(--faint); flex: none; white-space: nowrap; }
.fsets > .mrow + .mrow { padding-left: 22px; border-left: 1px solid var(--rule-soft); }
.fchips { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
.fc { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; background: #fff;
      border: 1px solid var(--rule); color: var(--ink-2); border-radius: 999px; padding: 4px 9px;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      transition: background .18s, border-color .18s, color .18s; }
.fc i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: block; }
.fc u { text-decoration: none; opacity: .5; font-variant-numeric: tabular-nums; margin-left: 2px;
        font-size: 10.5px; font-weight: 700; }
.fc:hover { border-color: rgba(0, 0, 0, .25); }
.fc.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.fc.on.tint { background: var(--t); border-color: var(--t); color: #fff; }
.fc.on u { opacity: .7; }

.more { position: relative; flex: none; }
.more-h { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
          color: var(--ink-2); background: #fff; border: 1px solid var(--rule); border-radius: 999px;
          padding: 4px 11px; cursor: default; white-space: nowrap; }
.more:hover .more-h, .more:focus-within .more-h { border-color: var(--navy); }
.more-h b { background: var(--navy); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; }
.more-b { position: absolute; top: 30px; right: 0; z-index: 40; width: max-content; max-width: 70vw;
          background: #fff; border: 1px solid var(--rule); border-radius: 16px; padding: 10px 14px;
          box-shadow: 0 16px 40px rgba(0, 6, 28, .14);
          opacity: 0; visibility: hidden; transform: translateY(-6px);
          transition: opacity .18s, transform .18s, visibility .18s; }
.more:hover .more-b, .more:focus-within .more-b { opacity: 1; visibility: visible; transform: none; }
.more-b .mrow + .mrow { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule-soft); }
.tally { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.fclear { font: inherit; font-size: 12px; font-weight: 600; background: none; border: 0; color: var(--jb-blue); cursor: pointer; flex: none; padding: 0; }

/* three columns ------------------------------------------------------- */
/* the side columns grow with the screen, so a wide monitor gets more text, not only a bigger sphere */
.stage { flex: 1; min-height: 0; display: grid; gap: 13px;
         grid-template-columns: clamp(270px, 22vw, 420px) minmax(0, 1fr) clamp(310px, 25vw, 460px); }
.col { min-width: 0; min-height: 0; }
/* the map on top, the node's figures in a strip under it */
.col-mid { display: flex; flex-direction: column; gap: 10px; }
.col-mid .board { flex: 1; min-height: 0; height: auto; }
.strip { flex: none; height: clamp(104px, 18vh, 220px); display: flex; gap: 8px; }
.strip:empty { display: none; }
.strip figure { flex: 1 1 0; min-width: 0; margin: 0; position: relative; overflow: hidden; cursor: zoom-in;
                background: #fff; border: 1px solid var(--rule); border-radius: 14px; transition: border-color .2s, transform .2s; }
.strip figure:hover { border-color: var(--navy); transform: translateY(-2px); }
.strip figure[data-go] { cursor: pointer; }
.strip img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 6px; }
.strip figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 7px; font-size: 11.5px; font-weight: 600;
                    line-height: 1.35; color: var(--ink); background: linear-gradient(rgba(255, 255, 255, 0), #fff 45%);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroller { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding-right: 3px; }
.scroller::-webkit-scrollbar { width: 7px; }
.scroller::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .13); border-radius: 8px; }

.chead { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 0 2px 7px; }
.lcard { background: #fff; border: 1px solid var(--rule); border-radius: 15px; padding: 11px 13px; margin-bottom: 9px; }
.lcard i { font-style: normal; display: block; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
.lcard b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.5; font-variant-numeric: tabular-nums; }
.lcard.hold { border-left: 3px solid var(--jb-green); }
.lcard.fail { border-left: 3px solid var(--jb-amber); }
/* the five numbers of an evidence node in one card, hairlines between */
.nums { background: #fff; border: 1px solid var(--rule); border-radius: 15px; padding: 2px 13px; margin-bottom: 9px; }
.nums > div { padding: 9px 0; border-top: 1px solid var(--rule-soft); }
.nums > div:first-child { border-top: 0; }
.nums .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nums i { font-style: normal; display: block; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
.nums b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.5; font-variant-numeric: tabular-nums; }
.nums .big b { font-size: 15px; }
.nums .hold i { color: #006B49; } .nums .fail i { color: #A85B00; }
.nums .hold, .nums .fail { margin: 0 -13px; padding: 9px 13px; }
.nums .hold { box-shadow: inset 3px 0 0 var(--jb-green); } .nums .fail { box-shadow: inset 3px 0 0 var(--jb-amber); }

/* with nothing selected the two side columns index the three shells */
.ix { margin: 0 0 14px; }
.ix-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 10px; font-weight: 700;
        letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 0 2px 7px; }
.ix-h u { text-decoration: none; font-variant-numeric: tabular-nums; }
.ix-row { display: block; width: 100%; text-align: left; font: inherit; background: #fff; border: 1px solid var(--rule);
          border-radius: 14px; padding: 10px 12px; margin-bottom: 7px; cursor: pointer; color: var(--ink-2);
          font-size: 12.5px; line-height: 1.5; transition: border-color .18s; }
.ix-row:hover { border-color: var(--navy); }
.ix-row b { display: block; color: var(--ink); font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
.ix-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.ix-chips button { font: inherit; font-size: 11.5px; font-weight: 600; line-height: 1.35; text-align: left; cursor: pointer;
                   background: #fff; border: 1px solid var(--rule); color: var(--ink-2); border-radius: 999px; padding: 3px 9px;
                   display: inline-flex; align-items: center; gap: 6px; transition: border-color .18s, background .18s, color .18s; }
.ix-chips button i { width: 7px; height: 7px; border-radius: 50%; flex: none; display: block; }
.ix-chips button:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
.ix-dom { font-size: 11px; font-weight: 700; margin: 7px 2px 4px; }
.ix-dom:first-of-type { margin-top: 0; }

.board { position: relative; height: 100%; border-radius: var(--r-lg); overflow: hidden;
         background: var(--navy); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09); }
.glow { position: absolute; border-radius: 50%; filter: blur(92px); opacity: .46; pointer-events: none;
        transition: background-color .75s ease, opacity .75s ease; }
.g1 { width: 46%; height: 64%; left: -11%; top: -19%; background: #0167EF; }
.g2 { width: 44%; height: 62%; right: -10%; bottom: -21%; background: #00B87A; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#cv.drag { cursor: grabbing; }
.spin { position: absolute; right: 13px; top: 11px; z-index: 3; font: inherit; font-size: 11.5px; font-weight: 600;
        background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .17); color: #fff;
        border-radius: 999px; padding: 5px 13px; cursor: pointer; }
.back { position: absolute; left: 13px; top: 11px; z-index: 3; font: inherit; font-size: 11.5px; font-weight: 600;
        background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .17); color: #fff;
        border-radius: 999px; padding: 5px 13px; cursor: pointer; display: none; }
.back.on { display: inline-block; }

.mpanel { background: #fff; border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 17px; }
/* the index needs no card around it: its chips are the cards */
.mpanel.bare { background: none; border: 0; padding: 0; }
.mpanel.bare .trail { margin-top: 4px; }
.mtag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; margin-bottom: 9px; }
.mpanel h2 { font-size: 19px; font-weight: 700; line-height: 1.32; margin: 0 0 11px; }
.spans { display: flex; gap: 5px; flex-wrap: wrap; margin: 0 0 11px; }
.spans span { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--paper-2); color: var(--faint); }
.mnum { background: var(--paper-2); border-radius: 14px; padding: 11px 13px; margin-bottom: 11px; font-variant-numeric: tabular-nums; }
.mnum b { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.5; }
.mnum span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.links { border-top: 1px solid var(--rule); margin-top: 5px; padding-top: 9px; }
.links h3 { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 0 0 7px; }
.lk { display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0; border-radius: 12px; padding: 6px 9px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }
.lk:hover { background: var(--paper-2); }
.lk b { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
.lk b::before { content: "→ "; color: var(--faint); }
.wk { display: inline-block; margin-top: 9px; font-size: 13px; font-weight: 600; }
.mhint { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0; }
.trail { border-top: 1px solid var(--rule); margin-top: 11px; padding-top: 9px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.trail span.lab { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.trail button { font: inherit; font-size: 11.5px; font-weight: 600; background: var(--paper-2); border: 0;
                border-radius: 999px; padding: 4px 10px; cursor: pointer; color: var(--ink-2); }
.trail button:hover { background: var(--navy); color: #fff; }


/* practice ------------------------------------------------------------ */
/* practice sits on the board, out of the way until wanted */
.prac { position: absolute; left: 13px; bottom: 12px; z-index: 4; }
.prac-h { display: inline-block; font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, .62);
          background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14);
          border-radius: 999px; padding: 5px 13px; cursor: default; transition: color .2s, background .2s; }
.prac:hover .prac-h, .prac:focus-within .prac-h, .prac.live .prac-h { color: #fff; background: rgba(255, 255, 255, .16); }
.prac-b { position: absolute; left: 0; bottom: 32px; display: flex; gap: 4px; padding: 4px;
          background: rgba(0, 6, 28, .9); border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px;
          opacity: 0; visibility: hidden; transform: translateY(5px); transition: opacity .18s, transform .18s, visibility .18s; }
.prac:hover .prac-b, .prac:focus-within .prac-b, .prac.live .prac-b { opacity: 1; visibility: visible; transform: none; }
.prac-b button { font: inherit; font-size: 11.5px; font-weight: 600; border: 0; background: none;
                 color: rgba(255, 255, 255, .66); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.prac-b button.on { background: #fff; color: var(--navy); }
.prac-b button:hover:not(.on) { color: #fff; }

/* the box that says how to say it */
.saybox { background: var(--navy); color: #fff; border-radius: 18px; padding: 15px 16px; margin-bottom: 10px; }
.saybox .sk { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .45); margin: 0; }
.saybox .kws { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0 12px; }
.saybox .kws span { background: rgba(255, 255, 255, .13); border-radius: 999px; padding: 5px 11px;
                    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.saybox p.script { font-size: 14.5px; line-height: 1.62; margin: 0; color: rgba(255, 255, 255, .9); }

.drill { background: #fff; border: 1px solid var(--rule); border-radius: 16px; padding: 14px 15px; margin-bottom: 9px; }
.drill .ask { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
.drill .say { font-size: 14.5px; font-weight: 600; line-height: 1.5; margin: 0 0 10px; }
.drill .mask { background: var(--paper-2); border-radius: 11px; padding: 11px 12px; color: var(--faint);
               font-size: 13px; text-align: center; letter-spacing: .14em; }
.drill .shown { font-size: 13.5px; font-weight: 600; line-height: 1.55; font-variant-numeric: tabular-nums; margin: 0; }
.drill.hold { border-left: 3px solid var(--jb-green); }
.drill.fail { border-left: 3px solid var(--jb-amber); }
.drill.done { background: var(--paper-3); }
.drow { display: flex; gap: 7px; margin-top: 10px; }
.dbtn { font: inherit; font-size: 12.5px; font-weight: 600; border: 1px solid var(--rule); background: #fff;
        color: var(--ink-2); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.dbtn:hover { border-color: var(--navy); }
.dbtn.go { background: var(--navy); border-color: var(--navy); color: #fff; }
.dbtn.yes { border-color: #9FE1CB; color: #006B49; }
.dbtn.yes:hover { background: var(--jb-mint); }
.dbtn.no { border-color: #F7C1C1; color: #A32D2D; }
.dbtn.no:hover { background: #FDECEA; }

.opt { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; line-height: 1.5;
       background: #fff; border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px;
       margin-bottom: 8px; cursor: pointer; color: var(--ink); transition: border-color .18s, background .18s; }
.opt:hover { border-color: var(--navy); }
.opt.right { border-color: var(--jb-green); background: var(--jb-mint); }
.opt.wrong { border-color: var(--jb-red); background: #FDECEA; }
.opt small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.pwhy { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); background: var(--paper-2);
        border-radius: 14px; padding: 12px 14px; margin: 2px 0 10px; }
.pwhy b { display: block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
.pbar { display: flex; gap: 4px; margin: 0 0 12px; }
.pbar span { flex: 1; height: 4px; border-radius: 3px; background: var(--rule); }
.pbar span.on { background: var(--navy); }
.pbar span.miss { background: var(--jb-amber); }
.pscore { display: flex; gap: 16px; align-items: baseline; margin: 0 0 12px; }
.pscore b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pscore span { font-size: 12.5px; color: var(--muted); }
.pnode { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.pnode b { color: var(--ink); font-weight: 600; }

#lb { position: fixed; inset: 0; z-index: 200; background: rgba(0, 6, 28, .93); display: none; align-items: center; justify-content: center; padding: 28px; cursor: zoom-out; }
#lb.on { display: flex; }
#lb img { max-width: 92vw; max-height: 82vh; border-radius: 14px; display: block; }
#lb p { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; color: rgba(255, 255, 255, .72); font-size: 14px; padding: 0 24px; margin: 0; }

@media (max-width: 1040px) {
  body { overflow: auto; }
  body > .foot, body > footer { display: block; }
  .full { height: auto; }
  .hdr { flex-direction: column; align-items: stretch; gap: 8px; }
  .stage { grid-template-columns: 1fr; }
  .col-mid .board { flex: none; height: 420px; }
  .strip { height: 132px; overflow-x: auto; }
  .strip figure { flex: 0 0 176px; }
  .scroller { height: auto; overflow: visible; }
  .col-figs { order: 3; } .col-card { order: 2; }
  .fsets { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
  .fsets > .mrow + .mrow { padding-left: 0; border-left: 0; }
  .mrow { flex-wrap: wrap; gap: 5px 10px; } .mrow > .lab { width: 100%; }
  /* one row per group that slides sideways, so the map is not four screens of chips down */
  .fchips { width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .fchips::-webkit-scrollbar { display: none; }
  .more { display: contents; }
  .more-b { position: static; opacity: 1; visibility: visible; transform: none; box-shadow: none; background: none;
            max-width: none; width: 100%; margin-top: 2px; border: 0; padding: 0; border-radius: 0; }
  .more-b .mrow + .mrow { margin-top: 6px; padding-top: 0; border-top: 0; }
  .more-h { display: none; }
}
</style>
</head>
<body>

<div class="full">
  <div class="hdr">
    <div class="fsets">
      <div class="mrow">
        <span class="lab" data-en="Domain" data-zh="領域"></span>
        <div class="fchips" id="f-dom"></div>
      </div>
      <div class="mrow">
        <span class="lab" data-en="Evidence for" data-zh="支持哪個獎"></span>
        <div class="fchips" id="f-aw"></div>
        <div class="more" id="more" tabindex="0">
          <span class="more-h"><span data-en="More" data-zh="更多"></span><b id="morecount">0</b>▾</span>
          <div class="more-b">
            <div class="mrow"><span class="lab" data-en="How strong" data-zh="證據強度"></span><div class="fchips" id="f-st"></div></div>
            <div class="mrow"><span class="lab" data-en="Lens" data-zh="鏡頭"></span><div class="fchips" id="f-lens"></div></div>
          </div>
        </div>
        <span class="tally" id="fcount"></span>
        <button class="fclear" id="fclear" data-en="Clear" data-zh="清除"></button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="col col-figs"><div class="scroller" id="figs"></div></div>
    <div class="col col-mid">
      <div class="board" id="board">
        <span class="glow g1" id="g1"></span><span class="glow g2" id="g2"></span>
        <canvas id="cv"></canvas>
        <div class="prac" id="prac" tabindex="0">
          <span class="prac-h" data-en="Practice" data-zh="練習"></span>
          <div class="prac-b" id="modes"></div>
        </div>
        <button class="back" id="back" data-en="Clear selection" data-zh="取消選取"></button>
        <button class="spin" id="spin" data-en="Pause" data-zh="暫停"></button>
      </div>
      <div class="strip" id="strip"></div>
    </div>
    <div class="col col-card"><div class="scroller"><aside class="mpanel" id="panel"></aside></div></div>
  </div>
</div>

<div id="lb" role="dialog" aria-modal="true"><img alt=""><p></p></div>

<script src="assets/js/site.js?v=202610311557"></script>
<script src="data/map.js?v=202610311557"></script>
<script src="data/bank.js?v=202610311557"></script>
<script>
(function () {
  var S = window.Site;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var board = document.getElementById('board'), figs = document.getElementById('figs');
  var panel = document.getElementById('panel'), lb = document.getElementById('lb');
  var strip = document.getElementById('strip');
  var g1 = document.getElementById('g1'), g2 = document.getElementById('g2');
  var R = { ev: 1, con: .56, imp: .2 };
  var NODES = MAP_NODES, byId = {}, DOM = {}, i, n;

  for (i = 0; i < MAP_DOMS.length; i++) { DOM[MAP_DOMS[i].id] = MAP_DOMS[i]; MAP_DOMS[i].n = 0; }
  for (i = 0; i < NODES.length; i++) {
    n = NODES[i]; byId[n.id] = n;
    var lon = (n.lon !== undefined ? n.lon : (DOM[n.dom] ? DOM[n.dom].lon : 0)) * Math.PI / 180;
    var lat = (n.lat || 0) * Math.PI / 180, r = R[n.k];
    n.p0 = [r * Math.cos(lat) * Math.sin(lon), r * Math.sin(lat), r * Math.cos(lat) * Math.cos(lon)];
    n.cur = n.p0.slice();
    n.col = n.k === 'ev' ? (DOM[n.dom] ? DOM[n.dom].c : '#fff') : (n.k === 'con' ? '#9FE8FF' : '#FFFFFF');

  }
  /* the must-drill set lands on the board: a priority question names the nodes
     it is asked about, so the node carries the question and glows for it */
  var QSTAR = (window.QUESTIONS || []).filter(function (q) { return q.star; });
  for (i = 0; i < QSTAR.length; i++) {
    var qn = QSTAR[i].nodes || [];
    for (var qj = 0; qj < qn.length; qj++) {
      var tgt = byId[qn[qj]];
      if (!tgt) continue;
      (tgt.star = tgt.star || []).push(QSTAR[i]);
    }
  }

  var LINKS = [];
  for (i = 0; i < MAP_EDGES.length; i++) {
    var e = MAP_EDGES[i], a = byId[e[0]], b = byId[e[1]];
    if (!a || !b) continue;
    var rec = { a: a, b: b, en: e[2], zh: e[3] };
    LINKS.push(rec); a.nb.push(rec); b.nb.push(rec);
  }

  function L(o, k) { return (S.lang === 'zh' && o[k + '_zh']) ? o[k + '_zh'] : (o[k] || ''); }
  function title(o) { return S.lang === 'zh' ? (o.zh || o.en) : o.en; }
  function shortOf(o) {

  function zh() { return S.lang === 'zh'; }

  /* ---------------------------------------------------------- filters */
  var F = { dom: {}, aw: {}, st: {}, risk: false, weak: false, star: false };
  function anyOn(g) { for (var k in g) if (g[k]) return true; return false; }
  function pass(nd) {
    if (F.star && !nd.star) return false;
    if (nd.k !== 'ev') return true;
    if (anyOn(F.dom) && !F.dom[nd.dom]) return false;
    var fx = nd.fx || {};
    if (anyOn(F.aw)) {
      var ok = false, aw = fx.aw || [];
      for (var j = 0; j < aw.length; j++) if (F.aw[aw[j]]) ok = true;
      if (!ok) return false;
    }
    if (anyOn(F.st) && !F.st[fx.st]) return false;
    if (F.risk && !fx.rk) return false;
    if (F.weak && defended(nd.id) === 4) return false;
    return true;
  }

  function chips() {

        (F.dom[d.id] ? '#fff' : d.c) + '" data-g="dom" data-v="' + d.id + '"><i></i>' +
        S.esc(zh() ? d.zh : d.en) + '<u>' + d.n + '</u></button>';

    for (j = 0; j < MAP_AWARDS.length; j++) {

      S.esc(zh() ? '★ 必練題問到的' : '★ The must-drill set asks about this') + '</button>' +
      '<button class="fc' + (F.risk ? ' on' : '') + '" data-g="risk" data-v="1">' +
      S.esc(zh() ? '評審一挖就會找到的' : 'A judge who digs lands here') + '</button>' +
      '<button class="fc' + (F.weak ? ' on' : '') + '" data-g="weak" data-v="1">' +
      S.esc(zh() ? '我還守不住的' : 'I cannot defend this yet') + '</button>';
    var more = 0;

    if (F.weak) more++;

    document.getElementById('morecount').style.display = more ? '' : 'none';
    summary(); paint();
  }

  function summary() {
    var tot = 0, vis = 0, j;
    for (j = 0; j < NODES.length; j++) if (NODES[j].k === 'ev') { tot++; if (pass(NODES[j])) vis++; }
    document.getElementById('fcount').textContent = vis + ' / ' + tot;
  }

  document.querySelector('.hdr').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-g]'); if (!b) return;
    var g = b.getAttribute('data-g'), v = b.getAttribute('data-v');
    if (g === 'risk') F.risk = !F.risk;
    else if (g === 'weak') F.weak = !F.weak;
    else if (g === 'star') F.star = !F.star;
    else F[g][v] = !F[g][v];
    chips();
    if (sel && !pass(sel)) select(null);
  });
  document.getElementById('fclear').addEventListener('click', function () {
    F = { dom: {}, aw: {}, st: {}, risk: false, weak: false, star: false }; chips();
  });

  /* ------------------------------------------- the board takes a colour */
  function paint() {
    var a = '#0167EF', b = '#00B87A';
    if (sel) {
      if (sel.k === 'ev') { a = DOM[sel.dom].c; b = a === '#0167EF' ? '#00B87A' : '#0167EF'; }
      else if (sel.k === 'con') { a = '#00A3C4'; b = '#0167EF'; }
      else { a = '#00B87A'; b = '#00A3C4'; }
    } else {
      var on = [];
      for (var j = 0; j < MAP_DOMS.length; j++) if (F.dom[MAP_DOMS[j].id]) on.push(MAP_DOMS[j].c);
      if (on.length === 1) { a = on[0]; b = on[0]; }
      else if (on.length > 1) { a = on[0]; b = on[on.length - 1]; }
    }
    g1.style.background = a; g2.style.background = b;
    g1.style.opacity = sel ? .58 : .46; g2.style.opacity = sel ? .5 : .46;
  }

  /* ---------------------------------------------------------- 3D */
  var yaw = -0.5, pitch = -0.22, yawT = yaw, pitchT = pitch;
  var spin = true, sel = null, hov = null, near = {}, grow = {};
  var W = 0, H = 0, dpr = 1, cxp = 0, cyp = 0, unit = 1;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    if (!W || !H) return;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cxp = W / 2; cyp = H / 2;
    unit = Math.min(W * 0.40, H * 0.42);
  }

  function project(p) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    var x = p[0] * cy - p[2] * sy, z = p[0] * sy + p[2] * cy, y = p[1];
    var y2 = y * cp - z * sp, z2 = y * sp + z * cp;
    var f = 3.1, s = f / (f - z2);
    return [cxp + x * unit * s, cyp - y2 * unit * s, z2, s];
  }
  function visible(nd) { return pass(nd); }

  function step() {
    var j, k, t;
    for (j = 0; j < NODES.length; j++) {
      var nd = NODES[j], push = 1;
      if (sel && !near[nd.id]) push = 1.45;
      else if (sel && nd !== sel) push = .9;
      for (k = 0; k < 3; k++) { t = nd.p0[k] * push; nd.cur[k] += (t - nd.cur[k]) * 0.085; }
      var want = nd === sel ? 1.75 : (sel && near[nd.id] ? 1.3 : 1);
      grow[nd.id] = (grow[nd.id] || 1) + (want - (grow[nd.id] || 1)) * 0.12;
    }
    if (sel) {
      var d = yawT - yaw;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;

    } else if (spin && !drag) { yaw += 0.0013; }
  }

  function hits(r, list) {
    for (var j = 0; j < list.length; j++) {
      var o = list[j];
      if (r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y) return true;
    }
    return false;
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    var j, nd, pr;
    for (j = 0; j < NODES.length; j++) NODES[j].pr = project(NODES[j].cur);

    for (j = 0; j < LINKS.length; j++) {
      var kk = LINKS[j], A = kk.a, B = kk.b;
      if (!visible(A) || !visible(B)) continue;
      var on = sel && (A === sel || B === sel);
      var zz = (A.pr[2] + B.pr[2]) / 2;
      var al = (0.10 + 0.14 * (zz + 1) / 2) * (sel ? (on ? 6 : .18) : 1);
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(al, .85) + ')';
      ctx.lineWidth = on ? 1.8 : 0.8;
      ctx.beginPath(); ctx.moveTo(A.pr[0], A.pr[1]); ctx.lineTo(B.pr[0], B.pr[1]); ctx.stroke();
    }

    var ord = NODES.slice().sort(function (a, b) { return a.pr[2] - b.pr[2]; });
    for (j = 0; j < ord.length; j++) {
      nd = ord[j]; pr = nd.pr;
      if (!visible(nd)) continue;
      var base = nd.k === 'ev' ? 5 : (nd.k === 'con' ? 8.5 : 7);
      var rr = base * pr[3] * (grow[nd.id] || 1);
      var depth = 0.45 + 0.55 * (pr[2] + 1) / 2;
      var a = depth * (sel ? (near[nd.id] ? 1 : .14) : 1);
      if (nd === hov) a = 1;
      ctx.globalAlpha = a;

         breathes, so the must-drill parts of the project are findable from
         across the board */
      if (nd.star) {
        var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 620 + nd.pr[0] * 0.01);
        ctx.beginPath(); ctx.arc(pr[0], pr[1], rr + 5 + 3 * pulse, 0, 6.2832);
        ctx.strokeStyle = '#F0A800'; ctx.lineWidth = 1.4;

        ctx.globalAlpha = a;

        ctx.beginPath(); ctx.arc(pr[0], pr[1], rr + 10, 0, 6.2832);
        ctx.strokeStyle = nd.col; ctx.lineWidth = 1.2; ctx.globalAlpha = a * .45; ctx.stroke();
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(pr[0], pr[1], rr + 5, 0, 6.2832);
        ctx.strokeStyle = nd.col; ctx.lineWidth = 1.6; ctx.stroke();

      ctx.fillStyle = nd.col; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,6,28,.75)'; ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* labels last: selected biggest, its neighbours next, nothing on top of anything */
    var placed = [];
    var pool = NODES.filter(function (x) {
      if (!visible(x)) return false;
      if (sel) return near[x.id];
      return x.k !== 'ev';
    }).sort(function (a, b) {
      if (a === sel) return 1; if (b === sel) return -1;
      return a.pr[2] - b.pr[2];
    }).reverse();

    for (j = 0; j < pool.length; j++) {
      nd = pool[j]; pr = nd.pr;
      if (!sel && pr[2] < -0.12) continue;
      var isSel = nd === sel;
      var txt = sel ? shortOf(nd) : title(nd);
      var fs = isSel ? Math.max(16, 19 * pr[3])
        : sel ? Math.max(12, 14 * pr[3])
          : Math.max(11, (nd.k === 'imp' ? 13 : 12.5) * pr[3]);
      ctx.font = (isSel ? '700 ' : sel ? '600 ' : nd.k === 'imp' ? '600 ' : '500 ') + fs +
        'px -apple-system, "PingFang TC", sans-serif';
      var w = ctx.measureText(txt).width;
      var base2 = nd.k === 'ev' ? 5 : (nd.k === 'con' ? 8.5 : 7);
      var yy = pr[1] - base2 * pr[3] * (grow[nd.id] || 1) - 10;
      var box = { x: pr[0] - w / 2 - 5, y: yy - fs, w: w + 10, h: fs + 7 };
      if (box.x < 2 || box.x + box.w > W - 2) continue;
      if (hits(box, placed) && !isSel) continue;
      placed.push(box);
      ctx.globalAlpha = isSel ? 1 : (0.5 + 0.5 * (pr[2] + 1) / 2) * (sel ? .95 : .92);
      ctx.textAlign = 'center';
      if (isSel) {
        ctx.fillStyle = 'rgba(0,6,28,.55)';
        ctx.beginPath(); ctx.roundRect(box.x - 4, box.y - 2, box.w + 8, box.h + 4, 9); ctx.fill();
      }
      ctx.fillStyle = isSel ? '#FFFFFF' : (nd.k === 'imp' ? '#FFFFFF' : 'rgba(216,244,255,.96)');
      ctx.fillText(txt, pr[0], yy);
      ctx.globalAlpha = 1;
    }

    if (hov && visible(hov) && hov !== sel && (hov.k === 'ev' || sel)) {
      var t2 = title(hov), x = hov.pr[0], y = hov.pr[1];
      ctx.font = '500 12.5px -apple-system, "PingFang TC", sans-serif';
      var tw = Math.min(ctx.measureText(t2).width + 20, W - 24);
      var bx = x + 13, by = y - 14;
      if (bx + tw > W - 6) bx = Math.max(6, x - 13 - tw);
      ctx.fillStyle = 'rgba(0,6,28,.94)';
      ctx.beginPath(); ctx.roundRect(bx, by, tw, 27, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
      ctx.fillText(t2, bx + 10, by + 18, tw - 20);
    }
  }

  function tick() { step(); draw(); requestAnimationFrame(tick); }

  var drag = false, lx = 0, ly = 0, moved = 0;
  cv.addEventListener('pointerdown', function (e) {

  function pick(mx, my) {

      var lim = Math.max((nd.k === 'ev' ? 12 : 15) * nd.pr[3] * (grow[nd.id] || 1), 10);
      if (d < lim && d < bd) { bd = d; best = nd; }
    }
    return best;
  }

  /* ---------------------------------------------------------- columns */
  var TEASE = ['C_MEM', 'M_SIO2', 'P_LADDER', 'I_BROPHY', 'H_LOOP', 'D_TWIN', 'B_GEO', 'W_L2'];
  var trail = [];

  function sayBox(nd) {

    if (kw && kw.length) {

  /* the strip under the board: a node's figures, or a few doors in */
  function showStrip(items) {

        (it.cap ? ' data-cap="' + S.esc(it.cap) + '"' : '') + '><img src="assets/img/' + it.src + '" alt="">' +

    }

  /* nothing selected: impact and the concepts on the left, every evidence node on the right */
  function coreIndex() {

    for (j = 0; j < NODES.length; j++) {

      if (NODES[j].k === 'con') con.push(NODES[j]);

    for (j = 0; j < imp.length; j++) {

    }
    h += '</div><div class="ix"><p class="ix-h"><span>' + (zh() ? '概念 · 中間層' : 'Concepts · the middle shell') + '</span><u>' + con.length + '</u></p><div class="ix-chips">';
    for (j = 0; j < con.length; j++) {

          (nd.star ? ' style="border-color:rgba(240,168,0,.6);color:#9A6B00"' : '') + '>' +

  /* a concept: which domains it joins; impact: why it matters */

        '<div class="nums"><div>' + sp.replace('class="spans"', 'class="spans" style="margin:0"') + '</div></div></div>' +
        '<div class="nums"><div><i>' + (zh() ? '為什麼重要' : 'why it matters') + '</i><b>' + S.esc(L(nd, 'note')) + '</b></div></div>';

    }

  function leftColumn(nd) {
    if (!nd) { figs.innerHTML = coreIndex(); showStrip(teasers()); return; }
    var h = sayBox(nd);
    if (nd.k === 'ev') {
      h += '<p class="chead">' + (zh() ? '這個節點的數字' : 'The numbers') + '</p><div class="nums">' +
        '<div class="big"><i>' + (zh() ? '數字' : 'the number') + '</i><b>' + S.esc(L(nd, 'num')) + '</b></div>' +
        '<div class="pair"><div><i>n</i><b>' + S.esc(L(nd, 'n')) + '</b></div>' +
        '<div><i>' + (zh() ? '對照' : 'control') + '</i><b>' + S.esc(L(nd, 'ctl')) + '</b></div></div>' +
        '<div class="hold"><i>' + (zh() ? '成立' : 'holds') + '</i><b>' + S.esc(L(nd, 'hold')) + '</b></div>' +
        '<div class="fail"><i>' + (zh() ? '失敗在哪' : 'fails') + '</i><b>' + S.esc(L(nd, 'fail')) + '</b></div></div>';
    } else {
      h += reach(nd);
    }
    figs.innerHTML = h; figs.scrollTop = 0;
    showStrip(figsOf(nd));
  }

  function trailHtml() {
    if (trail.length < 2) return '';
    var h = '<div class="trail"><span class="lab">' + (zh() ? '剛看過' : 'Just seen') + '</span>';
    for (var j = trail.length - 2; j >= 0 && j > trail.length - 7; j--) {
      h += '<button data-go="' + trail[j] + '">' + S.esc(shortOf(byId[trail[j]])) + '</button>';
    }
    return h + '</div>';
  }

  /* the questions from the must-drill set that are asked about this node, with
     the three keywords underneath each one and a link into the bank */
  function starHtml(nd) {
    var h = '<div class="mstar"><h3>★ ' +
      (zh() ? '必練題會從這裡問' : 'The must-drill set asks about this') + '</h3>', j, q, kw;
    for (j = 0; j < nd.star.length; j++) {
      q = nd.star[j];
      kw = (zh() ? (q.kw_zh || q.kw_en) : q.kw_en) || [];
      h += '<a href="bank.html?star=1#' + q.id + '"><b>' + S.esc(zh() ? (q.q_zh || q.q_en) : q.q_en) +
        '</b><span>' + S.esc(kw.join(' · ')) + '</span></a>';
    }
    return h + '</div>';
  }

  function card(nd) {
    var isEv = nd.k === 'ev', j;
    var col = isEv ? DOM[nd.dom].c : (nd.k === 'con' ? '#0A1433' : '#00061C');
    var kind = isEv ? (zh() ? DOM[nd.dom].zh : DOM[nd.dom].en)
      : nd.k === 'con' ? (zh() ? '概念' : 'Concept') : (zh() ? '影響' : 'Impact');
    var h = '<span class="mtag" style="background:' + col + '1f;color:' + col + '">' + S.esc(kind) + '</span>';
    h += '<h2>' + S.esc(title(nd)) + '</h2>';

    if (isEv) {
      var fx = nd.fx || {}, st = '';
      for (j = 0; j < MAP_STRENGTH.length; j++) if (MAP_STRENGTH[j].id === fx.st) st = zh() ? MAP_STRENGTH[j].zh : MAP_STRENGTH[j].en;
      h += '<div class="spans"><span style="background:' + col + ';color:#fff">' + S.esc(st) + '</span>';
      for (j = 0; j < MAP_AWARDS.length; j++) if ((fx.aw || []).indexOf(MAP_AWARDS[j].id) >= 0)
        h += '<span>' + S.esc(zh() ? MAP_AWARDS[j].zh : MAP_AWARDS[j].en) + '</span>';
      if (fx.rk) h += '<span style="background:#FDF1E0;color:#A85B00">' + (zh() ? '一挖就會找到' : 'judges land here') + '</span>';
      h += '</div>';
    }

    var ls = nd.nb.filter(function (k) { return (k.en || k.zh) && pass(k.a) && pass(k.b); });
    if (ls.length) {
      h += '<div class="links"><h3>' + (zh() ? '被寫下的連結' : 'Authored links') + '</h3>';
      for (j = 0; j < ls.length; j++) {
        var k2 = ls[j], ot = k2.a === nd ? k2.b : k2.a;
        var txt = zh() ? (k2.zh || k2.en) : k2.en;
        if (!txt) continue;
        h += '<button class="lk" data-go="' + ot.id + '"><b>' + S.esc(title(ot)) + '</b>' + S.esc(txt) + '</button>';
      }
      h += '</div>';
    }
    if (nd.star) h += starHtml(nd);
    if (nd.pg) h += '<a class="wk" href="' + S.wiki(nd.pg) + '" target="_blank" rel="noopener">' +
      (zh() ? '到 wiki 看這一頁 ↗' : 'Open this wiki page ↗') + '</a>';
    return h + trailHtml();
  }

  function empty() { return evIndex() + trailHtml(); }

  function select(nd) {
    sel = nd && pass(nd) ? nd : null;
    near = {};
    if (sel) {
      if (trail[trail.length - 1] !== sel.id) trail.push(sel.id);
      if (trail.length > 12) trail.shift();
      near[sel.id] = 1;
      for (var j = 0; j < sel.nb.length; j++) { near[sel.nb[j].a.id] = 1; near[sel.nb[j].b.id] = 1; }
      var p = sel.p0;
      yawT = Math.atan2(p[0], p[2]);
      var zr = Math.sqrt(p[0] * p[0] + p[2] * p[2]);
      pitchT = Math.max(-1.0, Math.min(1.0, Math.atan2(p[1], zr || 0.001)));
    }
    document.getElementById('back').classList.toggle('on', !!sel);
    render();
    paint();
    try { history.replaceState(null, '', sel ? '?n=' + sel.id : location.pathname); } catch (err) {}
  }

  function openLb(src, cap) {
    lb.querySelector('img').src = src;
    lb.querySelector('p').textContent = cap || (sel ? title(sel) : '');
    lb.classList.add('on');
  }
  figs.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) { select(byId[go.getAttribute('data-go')]); return; }
    var im = e.target.closest('img[data-full]'); if (im) openLb(im.getAttribute('data-full'));
  });
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (b) select(byId[b.getAttribute('data-go')]);
  });
  strip.addEventListener('click', function (e) {
    var f = e.target.closest('figure'); if (!f) return;
    if (f.hasAttribute('data-go')) select(byId[f.getAttribute('data-go')]);
    else openLb(f.getAttribute('data-full'), f.getAttribute('data-cap'));
  });
  /* pointing at a name in either index lights the node on the board */
  function lightFrom(e) {
    var b = e.target.closest('[data-go]');
    hov = b && !sel ? byId[b.getAttribute('data-go')] || null : hov;
  }
  figs.addEventListener('mouseover', lightFrom); panel.addEventListener('mouseover', lightFrom);
  figs.addEventListener('mouseleave', function () { if (!sel) hov = null; });
  panel.addEventListener('mouseleave', function () { if (!sel) hov = null; });
  lb.addEventListener('click', function () { lb.classList.remove('on'); });
  document.getElementById('back').addEventListener('click', function () { select(null); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (lb.classList.contains('on')) lb.classList.remove('on'); else select(null); }
  });

  var sb = document.getElementById('spin');
  sb.addEventListener('click', function () {
    spin = !spin;
    sb.setAttribute('data-en', spin ? 'Pause' : 'Spin');
    sb.setAttribute('data-zh', spin ? '暫停' : '旋轉');
    S.applyStatic(sb.parentNode);
  });


  /* ================================================================== */
  /* practice: three drills the Mock Room cannot run, because they need  */
  /* the graph. Defend trains one claim four fields deep; Bridge trains  */
  /* the concept that joins two domains; Trace walks a whole path.       */
  /* ================================================================== */
  var MODE = 'explore';
  var FIELDS = [
    { k: 'num', en: 'the number', zh: '數字' },
    { k: 'n', en: 'n', zh: 'n' },
    { k: 'ctl', en: 'the control', zh: '對照' },
    { k: 'bnd', en: 'the boundary', zh: '邊界' }
  ];
  var MKEY = 'rqa-map-mastery', M = {};
  try { M = JSON.parse(localStorage.getItem(MKEY) || '{}') || {}; } catch (err) { M = {}; }
  function saveM() { try { localStorage.setItem(MKEY, JSON.stringify(M)); } catch (err) {} }
  function defended(id) {
    var m = M[id], c = 0, j;
    if (!m) return 0;
    for (j = 0; j < FIELDS.length; j++) if (m[FIELDS[j].k] === 1) c++;
    return c;
  }
  function mark(id, k, ok) { (M[id] = M[id] || {})[k] = ok ? 1 : 0; saveM(); }

  var MODELIST = [
    { id: 'explore', en: 'Off', zh: '關閉' },
    { id: 'defend', en: 'Defend', zh: '守一題' },
    { id: 'bridge', en: 'Bridge', zh: '找橋' },
    { id: 'trace', en: 'Trace', zh: '走一條' }
  ];
  function modes() {
    var h = '', j;
    for (j = 0; j < MODELIST.length; j++) {
      h += '<button data-m="' + MODELIST[j].id + '"' + (MODE === MODELIST[j].id ? ' class="on"' : '') + '>' +
        S.esc(zh() ? MODELIST[j].zh : MODELIST[j].en) + '</button>';
    }
    document.getElementById('modes').innerHTML = h;
  }
  document.getElementById('modes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-m]'); if (!b) return;
    setMode(b.getAttribute('data-m'));
  });
  function setMode(m) {
    MODE = m; modes();
    document.getElementById('prac').classList.toggle('live', m !== 'explore');
    if (m === 'explore') { select(sel); return; }
    if (m === 'defend') startDefend();
    if (m === 'bridge') startBridge();
    if (m === 'trace') startTrace();
  }

  function pool() {
    var out = [], j;
    for (j = 0; j < NODES.length; j++) if (NODES[j].k === 'ev' && pass(NODES[j])) out.push(NODES[j]);
    return out;
  }
  function pick1(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }
  function scoreLine(done, total, label) {
    return '<div class="pscore"><b>' + done + ' / ' + total + '</b><span>' + S.esc(label) + '</span></div>';
  }
  function coverage() {
    var p = pool(), full = 0, j;
    for (j = 0; j < p.length; j++) if (defended(p[j].id) === 4) full++;
    return [full, p.length];
  }
  function exportRow() {
    return '<div class="pnode"><button class="dbtn" data-act="export">' +
      (zh() ? '匯出進度' : 'Export progress') + '</button></div>';
  }

  /* ------------------------------------------------------------ defend */
  var D = null;
  function startDefend() {
    var p = pool();
    if (!p.length) { panel.innerHTML = '<p class="mhint">' + (zh() ? '篩選之後沒有節點了。' : 'No nodes left under these filters.') + '</p>'; figs.innerHTML = ''; strip.innerHTML = ''; return; }
    var weak = p.filter(function (x) { return defended(x.id) < 4; });
    var node = pick1(weak.length ? weak : p);
    D = { node: node, step: 0, marks: [] };
    select(node);
  }
  function defendLeft() {
    var nd = D.node, h = '', j;
    showStrip(figsOf(nd));
    for (j = 0; j < FIELDS.length; j++) {
      var f = FIELDS[j], state = j < D.step ? 'done' : j === D.step ? 'now' : 'later';
      h += '<div class="drill' + (state === 'done' ? ' done' : '') + '">' +
        '<p class="ask">' + S.esc(zh() ? f.zh : f.en) + '</p>';
      if (state === 'later') {
        h += '<div class="mask">· · · · ·</div>';
      } else {
        h += fieldHtml(nd, f.k);
        if (state === 'now') {
          if (!D.revealed) {
            h += '<div class="drow"><button class="dbtn go" data-act="reveal">' +
              (zh() ? '我說完了，翻開' : 'Said it — reveal') + '</button></div>';
          } else {
            h += '<div class="drow"><button class="dbtn yes" data-act="hit">' + (zh() ? '說得出' : 'I had it') + '</button>' +
              '<button class="dbtn no" data-act="miss">' + (zh() ? '說不出' : 'I did not') + '</button></div>';
          }
        }
      }
      h += '</div>';
    }
    figs.innerHTML = h; figs.scrollTop = 0;
  }
  function fieldHtml(nd, k) {
    if (k === 'bnd') {
      return '<p class="shown" style="margin-bottom:7px"><b style="color:#006B49">' + (zh() ? '成立 · ' : 'Holds · ') + '</b>' + S.esc(L(nd, 'hold')) + '</p>' +
        '<p class="shown"><b style="color:#A85B00">' + (zh() ? '失敗 · ' : 'Fails · ') + '</b>' + S.esc(L(nd, 'fail')) + '</p>';
    }
    return '<p class="shown">' + S.esc(L(nd, k === 'ctl' ? 'ctl' : k)) + '</p>';
  }
  function defendPanel() {
    var nd = D.node, cov = coverage(), j;
    var h = '<span class="mtag" style="background:' + DOM[nd.dom].c + '1f;color:' + DOM[nd.dom].c + '">' +
      (zh() ? '守一題' : 'Defend') + '</span><h2>' + S.esc(title(nd)) + '</h2>';
    h += '<div class="pbar">';
    for (j = 0; j < FIELDS.length; j++) {
      var cls = j < D.step ? (D.marks[j] ? 'on' : 'miss') : '';
      h += '<span class="' + cls + '"></span>';
    }
    h += '</div>';
    h += '<p class="pnode">' + (zh()
      ? '依序說出它的數字、n、對照與邊界。說完才翻開。'
      : 'Say its number, its n, its control and its boundary, in that order. Reveal only after you have said it.') + '</p>';
    if (D.step >= FIELDS.length) {
      var got = 0;
      for (j = 0; j < D.marks.length; j++) if (D.marks[j]) got++;
      h += scoreLine(got, FIELDS.length, zh() ? '這個節點' : 'on this node');
      h += '<div class="drow" style="margin-bottom:12px"><button class="dbtn go" data-act="next">' +
        (zh() ? '下一個節點' : 'Next node') + '</button>' +
        '<button class="dbtn" data-act="seecard">' + (zh() ? '看完整卡片' : 'See the full card') + '</button></div>';
    }
    h += scoreLine(cov[0], cov[1], zh() ? '守得住的節點' : 'nodes you can defend');
    h += exportRow();
    panel.innerHTML = h;
  }

  /* ------------------------------------------------------------ bridge */
  var B = null;
  function bridgeSet() {
    var out = [], j, k;
    for (j = 0; j < NODES.length; j++) {
      var c = NODES[j]; if (c.k !== 'con') continue;
      var byDom = {};
      for (k = 0; k < c.nb.length; k++) {
        var o = c.nb[k].a === c ? c.nb[k].b : c.nb[k].a;
        if (o.k === 'ev' && pass(o)) (byDom[o.dom] = byDom[o.dom] || []).push(o);
      }
      var doms = Object.keys(byDom);
      if (doms.length >= 2) out.push({ c: c, doms: doms, byDom: byDom });
    }
    return out;
  }
  function startBridge() {
    var set = bridgeSet();
    if (!set.length) { panel.innerHTML = '<p class="mhint">' + (zh() ? '篩選之後湊不出跨領域的配對。' : 'No cross-domain pair survives these filters.') + '</p>'; figs.innerHTML = ''; strip.innerHTML = ''; return; }
    var pickSet = pick1(set), ds = shuffle(pickSet.doms.slice()).slice(0, 2);
    var a = pick1(pickSet.byDom[ds[0]]), b = pick1(pickSet.byDom[ds[1]]);
    var others = NODES.filter(function (x) { return x.k === 'con' && x !== pickSet.c; });
    var opts = shuffle([pickSet.c].concat(shuffle(others).slice(0, 2)));
    B = { a: a, b: b, c: pickSet.c, opts: opts, picked: null, score: B ? B.score : 0, runs: B ? B.runs : 0 };
    select(null);
    render();
  }
  function bridgeLeft() {
    var h = '', j, two = [B.a, B.b], shots = [];
    for (j = 0; j < two.length; j++) {
      h += '<p class="chead">' + S.esc(zh() ? DOM[two[j].dom].zh : DOM[two[j].dom].en) + '</p>';
      h += '<div class="lcard"><b>' + S.esc(title(two[j])) + '</b></div>';
      shots.push({ src: (two[j].img || [])[0], cap: title(two[j]) });
    }
    showStrip(shots);
    figs.innerHTML = h; figs.scrollTop = 0;
  }
  function edgeText(x, y) {
    for (var j = 0; j < x.nb.length; j++) {
      var e = x.nb[j], o = e.a === x ? e.b : e.a;
      if (o === y) return zh() ? (e.zh || e.en) : e.en;
    }
    return '';
  }
  function bridgePanel() {
    var h = '<span class="mtag" style="background:#0A14331f;color:#0A1433">' + (zh() ? '找橋' : 'Bridge') + '</span>';
    h += '<h2>' + (zh() ? '哪一個概念把這兩件事連起來？' : 'Which concept joins these two?') + '</h2>';
    h += '<p class="pnode"><b>' + S.esc(title(B.a)) + '</b><br>' + S.esc(zh() ? DOM[B.a.dom].zh : DOM[B.a.dom].en) +
      ' &nbsp;→&nbsp; ' + S.esc(zh() ? DOM[B.b.dom].zh : DOM[B.b.dom].en) + '<br><b>' + S.esc(title(B.b)) + '</b></p>';
    for (var j = 0; j < B.opts.length; j++) {
      var o = B.opts[j], cls = '';
      if (B.picked) cls = o === B.c ? ' right' : (o === B.picked ? ' wrong' : '');
      h += '<button class="opt' + cls + '" data-opt="' + o.id + '">' + S.esc(title(o)) + '</button>';
    }
    if (B.picked) {
      h += '<div class="pwhy"><b>' + (zh() ? '這條橋怎麼走' : 'How the bridge runs') + '</b>' +
        S.esc(edgeText(B.a, B.c)) + '<br><br>' + S.esc(edgeText(B.b, B.c)) + '</div>';
      h += '<div class="drow" style="margin-bottom:12px"><button class="dbtn go" data-act="nextbridge">' +
        (zh() ? '下一題' : 'Next') + '</button>' +
        '<button class="dbtn" data-act="openconcept">' + (zh() ? '打開這個概念' : 'Open the concept') + '</button></div>';
    }
    h += scoreLine(B.score, B.runs, zh() ? '找對的橋' : 'bridges found');
    panel.innerHTML = h;
  }

  /* ------------------------------------------------------------- trace */
  var T = null;
  function pathTo(from, to) {
    var q = [[from]], seen = {}, j;
    seen[from.id] = 1;
    while (q.length) {
      var p = q.shift(), last = p[p.length - 1];
      if (last === to) return p;
      if (p.length > 5) continue;
      for (j = 0; j < last.nb.length; j++) {
        var o = last.nb[j].a === last ? last.nb[j].b : last.nb[j].a;
        if (seen[o.id] || !pass(o)) continue;
        seen[o.id] = 1; q.push(p.concat([o]));
      }
    }
    return null;
  }
  function startTrace() {
    var evs = pool(), imps = NODES.filter(function (x) { return x.k === 'imp'; });
    var path = null, tries = 0;
    while (!path && tries < 40) {
      tries++;
      var p = pathTo(pick1(evs), pick1(imps));
      if (p && p.length >= 3) path = p;
    }
    if (!path) { panel.innerHTML = '<p class="mhint">' + (zh() ? '篩選之後走不出一條路。' : 'No path survives these filters.') + '</p>'; figs.innerHTML = ''; strip.innerHTML = ''; return; }
    T = { path: path, i: 0, picked: null, score: T ? T.score : 0, runs: T ? T.runs : 0, opts: null };
    traceOpts();
    select(path[0]);
  }
  function traceOpts() {
    var cur = T.path[T.i], right = T.path[T.i + 1];
    var wrong = NODES.filter(function (x) {
      if (x === right || x === cur || !pass(x)) return false;
      for (var j = 0; j < cur.nb.length; j++) { var o = cur.nb[j].a === cur ? cur.nb[j].b : cur.nb[j].a; if (o === x) return false; }
      return true;
    });
    T.opts = shuffle([right].concat(shuffle(wrong).slice(0, 2)));
  }
  function traceLeft() {
    var nd = T.path[T.i], h = '<p class="chead">' + (zh() ? '你現在站的位置' : 'Where you are standing') + '</p>', j;
    showStrip(figsOf(nd));
    h += '<div class="lcard"><i>' + S.esc(zh() ? '節點' : 'node') + '</i><b>' + S.esc(title(nd)) + '</b></div>';
    h += '<p class="chead" style="padding-top:5px">' + (zh() ? '這條路' : 'The path') + '</p>';
    for (j = 0; j < T.path.length; j++) {
      h += '<div class="lcard' + (j <= T.i ? '' : ' done') + '"><b>' +
        (j <= T.i ? S.esc(shortOf(T.path[j])) : '· · · · ·') + '</b></div>';
    }
    figs.innerHTML = h; figs.scrollTop = 0;
  }
  function tracePanel() {
    var done = T.i >= T.path.length - 1;
    var h = '<span class="mtag" style="background:#00061C1f;color:#00061C">' + (zh() ? '走一條' : 'Trace') + '</span>';
    h += '<h2>' + S.esc(title(T.path[T.path.length - 1])) + '</h2>';
    h += '<p class="pnode">' + (zh() ? '從 ' : 'From ') + '<b>' + S.esc(shortOf(T.path[0])) + '</b>' +
      (zh() ? ' 走到這裡，一次一跳。' : ' to here, one hop at a time.') + '</p>';
    if (done) {
      h += '<div class="pwhy"><b>' + (zh() ? '走完了' : 'Path complete') + '</b>' +
        (zh() ? '這條路跨了 ' : 'It crossed ') + countDoms(T.path) + (zh() ? ' 個領域。' : ' domains.') + '</div>';
      h += '<div class="drow" style="margin-bottom:12px"><button class="dbtn go" data-act="nexttrace">' +
        (zh() ? '再走一條' : 'Another path') + '</button></div>';
    } else {
      h += '<p class="say" style="font-size:15px;font-weight:600;margin:0 0 10px">' +
        (zh() ? '下一跳是哪一個？' : 'Which is the next hop?') + '</p>';
      for (var j = 0; j < T.opts.length; j++) {
        var o = T.opts[j], cls = '';
        if (T.picked) cls = o === T.path[T.i + 1] ? ' right' : (o === T.picked ? ' wrong' : '');
        h += '<button class="opt' + cls + '" data-topt="' + o.id + '">' + S.esc(title(o)) + '</button>';
      }
      if (T.picked) {
        var good = T.picked === T.path[T.i + 1];
        h += '<div class="pwhy"><b>' + (good ? (zh() ? '這條邊寫著' : 'That edge reads') : (zh() ? '那條邊不存在' : 'That edge does not exist')) + '</b>' +
          (good ? S.esc(edgeText(T.path[T.i], T.path[T.i + 1]))
            : (zh() ? '沒有人寫下「' + title(T.path[T.i]) + '」和「' + title(T.picked) + '」之間的句子。'
              : 'Nobody has written a sentence between “' + title(T.path[T.i]) + '” and “' + title(T.picked) + '”.')) + '</div>';
        if (good) h += '<div class="drow" style="margin-bottom:12px"><button class="dbtn go" data-act="hop">' +
          (zh() ? '走過去' : 'Take the hop') + '</button></div>';
        else h += '<div class="drow" style="margin-bottom:12px"><button class="dbtn go" data-act="retry">' +
          (zh() ? '再試一次' : 'Try again') + '</button></div>';
      }
    }
    h += scoreLine(T.score, T.runs, zh() ? '一次就走對的跳' : 'hops taken first time');
    panel.innerHTML = h;
  }
  function countDoms(p) {
    var d = {}, c = 0, j;
    for (j = 0; j < p.length; j++) if (p[j].k === 'ev' && !d[p[j].dom]) { d[p[j].dom] = 1; c++; }
    return c;
  }

  /* --------------------------------------------------------- dispatch */
  function render() {
    panel.classList.toggle('bare', MODE === 'explore' && !sel);
    if (MODE === 'explore') { leftColumn(sel); panel.innerHTML = sel ? card(sel) : empty(); return; }
    if (MODE === 'defend' && D) { defendLeft(); defendPanel(); return; }
    if (MODE === 'bridge' && B) { bridgeLeft(); bridgePanel(); return; }
    if (MODE === 'trace' && T) { traceLeft(); tracePanel(); return; }
  }

  function practiceClick(e) {
    var a = e.target.closest('[data-act]'), o = e.target.closest('[data-opt]'), t = e.target.closest('[data-topt]');
    if (o && B && !B.picked) {
      B.picked = byId[o.getAttribute('data-opt')];
      B.runs++; if (B.picked === B.c) B.score++;
      bridgePanel(); select(B.c); return;
    }
    if (t && T && !T.picked) {
      T.picked = byId[t.getAttribute('data-topt')];
      T.runs++; if (T.picked === T.path[T.i + 1]) T.score++;
      tracePanel(); return;
    }
    if (!a) return;
    var act = a.getAttribute('data-act');
    if (act === 'reveal') { D.revealed = true; defendLeft(); }
    else if (act === 'hit' || act === 'miss') {
      var ok = act === 'hit';
      D.marks[D.step] = ok ? 1 : 0;
      mark(D.node.id, FIELDS[D.step].k, ok);
      D.step++; D.revealed = false;
      defendLeft(); defendPanel();
    }
    else if (act === 'next') startDefend();
    else if (act === 'seecard') { MODE = 'explore'; modes(); select(D.node); }
    else if (act === 'nextbridge') startBridge();
    else if (act === 'openconcept') { MODE = 'explore'; modes(); select(B.c); }
    else if (act === 'hop') { T.i++; T.picked = null; if (T.i < T.path.length - 1) traceOpts(); select(T.path[T.i]); }
    else if (act === 'retry') { T.picked = null; tracePanel(); }
    else if (act === 'nexttrace') startTrace();
    else if (act === 'export') {
      var code = '';
      try { code = btoa(unescape(encodeURIComponent(JSON.stringify(M)))); } catch (err) { code = ''; }
      a.outerHTML = '<input readonly value="' + S.esc(code) + '" style="width:100%;font-size:12px" ' +
        'onclick="this.select()">';
    }
  }
  panel.addEventListener('click', practiceClick);
  figs.addEventListener('click', practiceClick);

  S.onLang(function () { chips(); modes(); render(); });
  window.addEventListener('resize', size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(board);

  size(); chips(); modes();
  var q = (location.search.match(/[?&]n=([^&]+)/) || [])[1];
  select(q && byId[q] ? byId[q] : null);
  tick();
})();
</script>
</body>
</html>
