<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Judging Room · ReLEAF Judging Trainer</title>
<link rel="stylesheet" href="assets/css/base.css?v=202610250241">
<link rel="stylesheet" href="assets/css/pages.css?v=202610250241">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%231a7f45'/%3E%3C/svg%3E">
</head>
<body>

<header class="hero wrap narrow">
  <p class="eyebrow" data-en="03 · Mock Judging Room" data-zh="03 · 模擬會場"></p>
  <h1 data-en="Room J03. Four strangers." data-zh="J03 會談室。四個陌生人。"></h1>
  <p class="lede"
     data-en="The panel is generated fresh: four judges, four backgrounds, and no way to tell from a face who will ask about membranes. That is the point. Answer out loud, standing up, then call the seat — and the room tells you whether the microphone went to the right person."
     data-zh="這組評審是現場生成的：四個人、四種背景，而你沒辦法從一張臉看出誰會問薄膜。這正是重點。站起來出聲回答，然後指定位置——這間房間會告訴你麥克風有沒有交到對的人手上。"></p>
</header>

<section class="wrap" style="padding-top:0">
  <div class="panel">
    <div class="panel-top">
      <div class="meta" id="panelline"></div>
      <button class="btn btn-ghost btn-sm" id="reroll" type="button"></button>
    </div>
    <svg class="bench" id="bench" viewBox="0 0 920 210" role="img" aria-label="Four judges at the bench"></svg>
  </div>

  <div class="scorebar">
    <label class="playas"><span id="l-playing"></span>
      <input id="playas" type="text" maxlength="18" autocomplete="off"></label>
    <span class="sc"><i id="l-score"></i><b id="sc-score">0</b></span>
    <span class="sc"><i id="l-streak"></i><b id="sc-streak">0</b></span>
    <span class="sc"><i id="l-n"></i><b id="sc-n">0/0</b></span>
  </div>

  <div class="bubble">
    <p class="who" id="who"></p>
    <p class="qq" id="qq" data-en="Ready when you are." data-zh="準備好就開始。"></p>
    <div class="meta" id="meta"></div>

    <div class="btn-row" style="margin-top:1.1rem">
      <button class="btn btn-accent" id="start" type="button"></button>
      <button class="btn btn-ghost" id="show" type="button" hidden></button>
      <button class="btn btn-line" id="nextq" type="button" hidden></button>
      <button class="btn btn-ghost btn-sm" id="endrun" type="button" hidden></button>
      <span class="ring" id="ringwrap" hidden>
        <span class="timer" id="timer">1:30</span>
        <button class="btn btn-ghost btn-sm" id="pause" type="button"></button>
      </span>
    </div>

    <div class="guessbox" id="guessbox" hidden>
      <h4 id="whoq"></h4>
      <p class="hint" id="whohint"></p>
      <div class="chips" id="seatchips"></div>
    </div>

    <div class="guessres" id="guessres" hidden></div>

    <div class="btn-row" id="marks" hidden style="margin-top:.9rem">
      <button class="btn btn-ghost btn-sm" id="mgood" type="button"></button>
      <button class="btn btn-ghost btn-sm" id="mbad" type="button"></button>
    </div>

    <div class="fubox" id="fubox" hidden>
      <p class="fuw"><b id="fuwho"></b> <span data-en="leans in" data-zh="身體往前傾"></span></p>
      <p class="fut" id="futext"></p>
      <div class="btn-row">
        <button class="btn btn-accent btn-sm" id="fudid" type="button"></button>
        <button class="btn btn-ghost btn-sm" id="fumiss" type="button"></button>
      </div>
    </div>

    <div class="answer" id="ans" hidden>
      <h4 data-en="How to answer it" data-zh="怎麼回答"></h4>
      <div class="kw" id="akw"></div>
      <p class="a-text" id="atext"></p>
      <div class="trap" id="atrap" hidden><b data-en="Likely mistake" data-zh="容易犯的錯"></b><span id="atrapt"></span></div>
      <div class="meta" id="asrc" style="margin-top:.9rem"></div>
    </div>

    <div class="summary" id="summary" hidden>
      <p class="sg" id="sumgrade"></p>
      <p class="ss"><b id="sumscore">0</b> <span data-en="points" data-zh="分"></span></p>
      <div class="sbits" id="sumbits"></div>
      <div class="saverow">
        <label for="pname" id="nameln"></label>
        <input class="search" id="pname" type="text" maxlength="18" autocomplete="off">
        <button class="btn btn-accent btn-sm" id="savebtn" type="button"></button>
        <button class="btn btn-ghost btn-sm" id="againbtn" type="button"></button>
      </div>
      <div class="codebox" id="codebox" hidden>
        <input class="search" id="mycode" type="text" readonly>
        <button class="btn btn-line btn-sm" id="copycode" type="button"></button>
      </div>
    </div>

    <div class="prog" id="prog"></div>
  </div>
  <div class="toast" id="toast"></div>
</section>

<div class="bar">
  <div class="wrap">
    <div class="bar-row">
      <span class="pill pill-line" data-en="Deck" data-zh="題庫"></span>
      <div class="chips" id="modes"></div>
    </div>
    <div class="bar-row">
      <span class="pill pill-line" data-en="Run" data-zh="一局"></span>
      <div class="chips" id="lens"></div>
      <span class="count-l" id="deckn"></span>
    </div>
    <div class="bar-row">
      <div class="chips" id="doms"></div>
    </div>
    <div class="bar-row">
      <div class="chips" id="types"></div>
    </div>
  </div>
</div>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="The board" data-zh="排行榜"></h2>
    <p data-en="Finish a deck, put your name up. To get on somebody else's board, send them your code and have them paste it in."
       data-zh="練完一組就把名字放上去。想上別人的排行榜，把你的代碼傳給他們，請他們貼上去。"></p>
  </div>
  <div id="board"></div>
  <div class="boardtools">
    <input class="search" id="theircode" type="text" autocomplete="off">
    <button class="btn btn-line btn-sm" id="addcode" type="button"></button>
    <button class="btn btn-ghost btn-sm" id="wipe" type="button"></button>
  </div>
  <p class="src" id="boardnote" style="margin-top:.6rem"></p>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="Where you are shaky" data-zh="你不熟的題目"></h2>
    <p data-en="Questions you marked as shaky stay here until you clear them. Stored in this browser only."
       data-zh="你標成「不熟」的題目會留在這裡，直到你清掉。只存在這台瀏覽器裡。"></p>
  </div>
  <div id="shaky"></div>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 data-en="Questions judges actually asked" data-zh="評審真正問過的問題"></h2>
    <p data-en="From the team's own record of 2025 sessions and earlier rounds. Not about our project, but these are the shapes the panel reaches for. The deck above is built from these patterns."
       data-zh="來自隊上自己記錄的 2025 年場次與更早的回合。這些不是我們專題的問題，但評審就是用這些句型提問。上面的題庫就是照這些模式出的。"></p>
  </div>
  <input class="search" id="rq" type="search" autocomplete="off" style="margin-bottom:1rem"
         data-ph-en="Search the recorded bank: scale, replicates, validate, cost…"
         data-ph-zh="搜尋實錄題庫：scale、replicates、validate、cost……">
  <div id="rec"></div>
</section>

<script src="assets/js/site.js?v=202610250241"></script>
<script src="data/meta.js?v=202610250241"></script>
<script src="data/bank.js?v=202610250241"></script>
<script src="data/recorded.js?v=202610250241"></script>
<script src="assets/js/panel.js?v=202610250241"></script>
<script src="assets/js/mock.js?v=202610250241"></script>
</body>
</html>
