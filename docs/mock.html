<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Judging Room · ReLEAF Judging Trainer</title>
<link rel="stylesheet" href="assets/css/base.css?v=202610250343">
<link rel="stylesheet" href="assets/css/pages.css?v=202610250343">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%231a7f45'/%3E%3C/svg%3E">
</head>
<body>

<header class="hero wrap">
  <p class="eyebrow" data-en="03 · Mock Judging Room" data-zh="03 · 模擬會場"></p>
  <h1 data-en="Room J03. Four strangers." data-zh="J03 會談室。四個陌生人。"></h1>
  <p class="lede" style="max-width:56ch"
     data-en="The panel is generated fresh, and none of them owns a subject. Answer out loud, then call the seat."
     data-zh="評審是現場生成的，沒有人固定負責哪個主題。先出聲回答，再指定位置。"></p>
</header>

<div class="wrap room">

  <aside class="rail">
    <div class="rail-card">
      <span class="rail-lab" id="l-playing"></span>
      <button class="whobtn" id="whobtn" type="button">
        <span class="whoface" id="whoface"></span>
        <span class="whoname" id="whoname"></span>
      </button>
    </div>

    <div class="rail-group">
      <h4 id="l-run"></h4>
      <div class="chips chips-col" id="lens"></div>
    </div>

    <div class="rail-group">
      <h4 id="l-deck"></h4>
      <div class="chips chips-col" id="modes"></div>
    </div>

    <details class="rail-more" id="moref">
      <summary id="l-narrow"></summary>
      <div class="rail-group">
        <h4 id="l-dom"></h4>
        <div class="chips" id="doms"></div>
      </div>
      <div class="rail-group">
        <h4 id="l-type"></h4>
        <div class="chips" id="types"></div>
      </div>
    </details>

    <p class="rail-count" id="deckn"></p>
  </aside>

  <main class="stage">
    <div class="panel">
      <div class="panel-top">
        <div class="meta" id="panelline"></div>
        <button class="btn btn-ghost btn-sm" id="reroll" type="button"></button>
      </div>
      <svg class="bench" id="bench" viewBox="0 0 920 210" role="img" aria-label="Four judges at the bench"></svg>
    </div>

    <div class="scorebar">
      <span class="sc"><i id="l-score"></i><b id="sc-score">0</b></span>
      <span class="sc"><i id="l-streak"></i><b id="sc-streak">0</b></span>
      <span class="sc"><i id="l-n"></i><b id="sc-n">0/0</b></span>
    </div>

    <div class="bubble">
      <p class="who" id="who"></p>
      <p class="qq" id="qq" data-en="Ready when you are." data-zh="準備好就開始。"></p>
      <div class="meta" id="meta"></div>

      <div class="btn-row" style="margin-top:1.1rem">
        <button class="btn btn-accent" id="start" type="button"></button>
        <button class="btn btn-ghost" id="show" type="button" hidden></button>
        <button class="btn btn-line" id="nextq" type="button" hidden></button>
        <button class="btn btn-ghost btn-sm" id="endrun" type="button" hidden></button>
        <span class="ring" id="ringwrap" hidden>
          <span class="timer" id="timer">1:30</span>
          <button class="btn btn-ghost btn-sm" id="pause" type="button"></button>
        </span>
      </div>

      <div class="guessbox" id="guessbox" hidden>
        <h4 id="whoq"></h4>
        <p class="hint" id="whohint"></p>
        <div class="chips" id="seatchips"></div>
      </div>

      <div class="guessres" id="guessres" hidden></div>

      <div class="btn-row" id="marks" hidden style="margin-top:.9rem">
        <button class="btn btn-ghost btn-sm" id="mgood" type="button"></button>
        <button class="btn btn-ghost btn-sm" id="mbad" type="button"></button>
      </div>

      <div class="fubox" id="fubox" hidden>
        <p class="fuw"><b id="fuwho"></b> <span data-en="leans in" data-zh="身體往前傾"></span></p>
        <p class="fut" id="futext"></p>
        <div class="btn-row">
          <button class="btn btn-accent btn-sm" id="fudid" type="button"></button>
          <button class="btn btn-ghost btn-sm" id="fumiss" type="button"></button>
        </div>
      </div>

      <div class="answer" id="ans" hidden>
        <h4 data-en="How to answer it" data-zh="怎麼回答"></h4>
        <div class="kw" id="akw"></div>
        <p class="a-text" id="atext"></p>
        <div class="trap" id="atrap" hidden><b data-en="Likely mistake" data-zh="容易犯的錯"></b><span id="atrapt"></span></div>
        <div class="meta" id="asrc" style="margin-top:.9rem"></div>
      </div>

      <div class="prog" id="prog"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="whomodal" hidden>
  <div class="modal-in modal-pick" role="dialog" aria-modal="true">
    <button class="modal-x" id="whox" type="button" aria-label="Close">&times;</button>
    <h3 id="whotitle"></h3>
    <input class="search" id="whosearch" type="search" autocomplete="off">
    <div id="wholist"></div>
    <div class="guestrow">
      <input class="search" id="guestname" type="text" maxlength="18" autocomplete="off">
      <button class="btn btn-ghost btn-sm" id="guestgo" type="button"></button>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-in" role="dialog" aria-modal="true">
    <button class="modal-x" id="modalx" type="button" aria-label="Close">&times;</button>
    <div class="cardwrap"><canvas id="cardcv" width="1200" height="630"></canvas></div>
    <div class="modal-foot">
      <div class="btn-row">
        <button class="btn btn-accent btn-sm" id="copyimg" type="button"></button>
        <button class="btn btn-line btn-sm" id="dlimg" type="button"></button>
        <button class="btn btn-ghost btn-sm" id="againbtn" type="button"></button>
      </div>
      <p class="src" id="imghint"></p>
    </div>
  </div>
</div>

<section class="wrap narrow">
  <details class="fold">
    <summary data-en="Where you are shaky" data-zh="你不熟的題目"></summary>
    <div id="shaky"></div>
  </details>
  <details class="fold">
    <summary data-en="Questions judges actually asked other teams" data-zh="評審問過其他隊伍的問題"></summary>
    <input class="search" id="rq" type="search" autocomplete="off" style="margin:1rem 0"
           data-ph-en="Search the recorded bank: scale, replicates, validate, cost…"
           data-ph-zh="搜尋實錄題庫：scale、replicates、validate、cost……">
    <div id="rec"></div>
  </details>
</section>

<script src="assets/js/site.js?v=202610250343"></script>
<script src="data/meta.js?v=202610250343"></script>
<script src="data/roster.js?v=202610250343"></script>
<script src="data/bank.js?v=202610250343"></script>
<script src="data/recorded.js?v=202610250343"></script>
<script src="assets/js/panel.js?v=202610250343"></script>
<script src="assets/js/mock.js?v=202610250343"></script>
</body>
</html>
