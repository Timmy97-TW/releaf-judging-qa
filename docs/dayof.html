<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Sheet · ReLEAF Judging Trainer</title>
<link rel="stylesheet" href="assets/css/base.css?v=202610240220">
<link rel="stylesheet" href="assets/css/pages.css?v=202610240220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%231a7f45'/%3E%3C/svg%3E">
</head>
<body>

<header class="hero wrap">
  <p class="eyebrow" data-en="07 · Day Sheet" data-zh="07 · 當天流程"></p>
  <h1 data-en="You are the first team of the day" data-zh="你們是當天第一組"></h1>
  <p class="lede" style="max-width:62ch"
     data-en="The Judging Zone opens at 11:30 and you must be there by 11:50. Nothing about this slot forgives being late, and sessions cannot start late or run over for any reason."
     data-zh="Judging Zone 11:30 開放，你們最晚 11:50 必須到。這個時段不容許任何遲到，而會談無論任何原因都不能延後開始或超時。"></p>
  <p class="cd" id="countdown" style="margin-top:1rem"></p>
</header>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="From two weeks out to the door" data-zh="從兩週前到進門"></h2>
  </div>
  <ul class="tl" id="tl"></ul>
</section>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="What goes in the bag" data-zh="要帶的東西"></h2>
    <p data-en="Tick these the night before. WiFi is not available for streaming, so the cable is not optional."
       data-zh="前一晚逐項打勾。串流不能用 WiFi，所以網路線不是可選項。"></p>
  </div>
  <ul class="check" id="kit"></ul>
  <button class="btn btn-ghost btn-sm no-print" id="clear" style="margin-top:1rem"></button>
</section>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="In the room" data-zh="在會談室裡"></h2>
  </div>
  <ul class="trap-list" id="room" style="list-style:none"></ul>
</section>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="The twenty minutes, budgeted" data-zh="二十分鐘的分配"></h2>
    <p data-en="Twenty minutes of questions is roughly fourteen answers. This is what that looks like, and why a three-minute answer is expensive."
       data-zh="二十分鐘問答大約是十四個回答。這張表說明它長什麼樣子，以及為什麼一個三分鐘的回答代價很高。"></p>
  </div>
  <table class="t">
    <thead><tr>
      <th data-en="If your answers average" data-zh="若平均每題"></th>
      <th data-en="The panel gets to ask" data-zh="評審能問"></th>
      <th data-en="What that means" data-zh="意義"></th>
    </tr></thead>
    <tbody>
      <tr><td>60 s</td><td data-en="about 18 questions" data-zh="大約 18 題"></td>
          <td data-en="Every nomination gets covered, and the village judge gets their turn." data-zh="三個提名都會被問到，村評審也有機會提問。"></td></tr>
      <tr><td>90 s</td><td data-en="about 13 questions" data-zh="大約 13 題"></td>
          <td data-en="Comfortable. This is the target." data-zh="從容。這是目標值。"></td></tr>
      <tr><td>2 min</td><td data-en="about 10 questions" data-zh="大約 10 題"></td>
          <td data-en="One nomination gets two questions instead of four." data-zh="某個提名只會被問兩題，而不是四題。"></td></tr>
      <tr><td>3 min</td><td data-en="about 6 questions" data-zh="大約 6 題"></td>
          <td data-en="Most of your project never comes up, and the panel feels unheard." data-zh="專題大部分內容不會被提到，而評審會覺得沒被聽見。"></td></tr>
    </tbody>
  </table>
</section>

<section class="wrap narrow">
  <div class="sec-head">
    <h2 data-en="Print this" data-zh="把這個印出來"></h2>
    <p data-en="One sheet in the room: the ten numbers and the seven seats. Nothing else should be on paper, because reading on stage is worse than pausing."
       data-zh="現場只帶一張紙：十個數字和七個位置。其他都不要印，因為在台上念稿比停頓更糟。"></p>
  </div>
  <div class="btn-row no-print">
    <button class="btn btn-accent" onclick="window.print()" data-en="Print the sheet" data-zh="列印這張表"></button>
  </div>
  <div class="grid g2" style="margin-top:1.5rem">
    <div>
      <h4 data-en="The ten numbers" data-zh="十個數字"></h4>
      <div id="ten" style="display:grid;gap:.4rem;margin-top:.6rem"></div>
    </div>
    <div>
      <h4 data-en="The seven seats" data-zh="七個位置"></h4>
      <div id="seats" style="display:grid;gap:.4rem;margin-top:.6rem"></div>
    </div>
  </div>
</section>

<script src="assets/js/site.js?v=202610240220"></script>
<script src="data/content.js?v=202610240220"></script>
<script src="data/facts.js?v=202610240220"></script>
<script src="data/ten.js?v=202610240220"></script>
<script>
(function () {
  var S = window.Site;
  var done = S.load('kit', {});

  function drawTl() {
    var h = '';
    for (var i = 0; i < CONTENT.timeline.length; i++) {
      var t = CONTENT.timeline[i];
      h += '<li><span class="when">' + S.esc(S.t(t, 't')) + '</span><span class="what">' + S.esc(S.t(t, 'b')) + '</span></li>';
    }
    document.getElementById('tl').innerHTML = h;
  }

  function drawKit() {
    var h = '';
    for (var i = 0; i < CONTENT.kit.length; i++) {
      h += '<li class="' + (done[i] ? 'done' : '') + '"><input type="checkbox" data-k="' + i + '"' +
        (done[i] ? ' checked' : '') + '><span>' + S.esc(S.p(CONTENT.kit[i])) + '</span></li>';
    }
    document.getElementById('kit').innerHTML = h;
  }

  function drawRoom() {
    var h = '';
    for (var i = 0; i < CONTENT.roomRules.length; i++) {
      h += '<li style="display:grid;grid-template-columns:auto 1fr;gap:.7rem"><span style="color:var(--accent)">·</span><span>' +
        S.esc(S.p(CONTENT.roomRules[i])) + '</span></li>';
    }
    document.getElementById('room').innerHTML = h;
  }

  function drawSheet() {
    var byId = {}, i, h = '';
    for (i = 0; i < FACTS.length; i++) byId[FACTS[i].id] = FACTS[i];
    for (i = 0; i < TEN.length; i++) {
      var f = byId[TEN[i]];
      if (!f) continue;
      h += '<div class="card card-soft" style="padding:.6rem .8rem">' +
        '<div style="font-size:.75rem;color:var(--muted)">' + S.esc(S.t(f, 'label')) + '</div>' +
        '<div style="font-weight:600">' + S.esc(f.value) + '</div></div>';
    }
    document.getElementById('ten').innerHTML = h;

    h = '';
    for (i = 0; i < CONTENT.seats.length; i++) {
      var s = CONTENT.seats[i];
      h += '<div class="card card-soft" style="padding:.6rem .8rem">' +
        '<div style="font-weight:600">' + s.n + ' · ' + S.t(s, 'name') + '</div>' +
        '<div style="font-size:.75rem;color:var(--muted)">' + S.esc(S.t(s, 'owns').slice(0, 90)) + '…</div></div>';
    }
    document.getElementById('seats').innerHTML = h;
  }

  document.getElementById('kit').addEventListener('change', function (e) {
    var b = e.target.closest('[data-k]'); if (!b) return;
    done[b.getAttribute('data-k')] = b.checked;
    S.save('kit', done); drawKit();
  });
  document.getElementById('clear').addEventListener('click', function () {
    done = {}; S.save('kit', done); drawKit();
  });

  var TARGET = Date.UTC(2026, 10, 13, 11, 0, 0);
  function cd() {
    var ms = TARGET - Date.now(), el = document.getElementById('countdown');
    if (ms <= 0) { el.textContent = S.lang === 'zh' ? '就是現在。' : 'This is it.'; return; }
    var d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24;
    el.textContent = S.lang === 'zh' ? '距離 J03、12:00 還有 ' + d + ' 天 ' + h + ' 小時'
      : d + ' days and ' + h + ' hours until J03, 12:00';
  }

  S.onLang(function () {
    document.getElementById('clear').textContent = S.lang === 'zh' ? '全部取消勾選' : 'Clear all';
    drawTl(); drawKit(); drawRoom(); drawSheet(); cd();
  });
  setInterval(cd, 60000);
})();
</script>
</body>
</html>
