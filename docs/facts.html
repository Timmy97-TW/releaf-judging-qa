<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Foundation · ReLEAF Judging Trainer</title>
<link rel="stylesheet" href="assets/css/base.css?v=202610300100">
<link rel="stylesheet" href="assets/css/pages.css?v=202610300100">
<link rel="stylesheet" href="assets/css/theme.css?v=202610300100">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%231a7f45'/%3E%3C/svg%3E">
<style>
/* the fact list reads as a spec sheet: label left, number right, detail folded */
.flist { border-top: 1px solid var(--rule-soft); }
.fitem { border-bottom: 1px solid var(--rule-soft); }
.fact {
  display: grid; grid-template-columns: 236px minmax(0, 1fr) 18px; gap: 18px; align-items: baseline;
  width: 100%; text-align: left; font: inherit; background: none; border: 0;
  padding: 13px 10px; cursor: pointer; border-radius: 12px; transition: background .15s;
}
.fact:hover { background: var(--paper-3); }
.fact[aria-expanded="true"] { background: var(--paper-3); }
.f-lab { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.f-val { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; line-height: 1.5; font-variant-numeric: tabular-nums; }
.f-more { font-size: 15px; color: var(--faint); justify-self: end; transition: transform .2s, color .2s; }
.fact[aria-expanded="true"] .f-more { transform: rotate(45deg); color: var(--ink); }
.f-det { padding: 0 10px 15px 264px; font-size: 14px; line-height: 1.65; color: var(--ink-2); }
.f-det .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 9px; }
.fitem.star .f-val { color: var(--accent-deep); }
.fitem.star .fact::before { content: "★"; position: absolute; margin-left: -18px; color: var(--jb-green); font-size: 11px; }
.fitem.star .fact { position: relative; }
.fitem.conflict .f-val { color: var(--amber); }
.fact-group { margin-bottom: 2rem; }
.fact-group h3 {
  position: sticky; top: calc(var(--nav-h, 60px) + 2px); z-index: 5;
  background: var(--paper-2); padding: 9px 10px; margin: 0;
  font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
}
.fact-group h3 .c { color: var(--rule); font-weight: 600; }
.ftools { display: flex; gap: 8px; align-items: center; margin: 0 0 6px; }
.ftool { font: inherit; font-size: 12.5px; font-weight: 600; background: #fff; border: 1px solid var(--rule);
         color: var(--ink-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.ftool:hover { border-color: var(--navy); }
.top10 .fitem { border: 0; background: var(--accent-wash); border-radius: 14px; margin-bottom: 7px; }
.top10 .f-det { padding-left: 264px; }
@media (max-width: 760px) {
  .fact { grid-template-columns: minmax(0, 1fr) 18px; gap: 4px 12px; }
  .f-lab { grid-column: 1 / 2; }
  .f-val { grid-column: 1 / 2; }
  .f-more { grid-row: 1 / 3; grid-column: 2; }
  .f-det { padding-left: 10px; }
  .top10 .f-det { padding-left: 10px; }
}
</style>
</head>
<body>

<header class="hero wrap">
  <p class="eyebrow" data-en="01 · Fact Foundation" data-zh="01 · 事實庫"></p>
  <h1 data-en="Every number, and where it came from" data-zh="每一個數字，以及它的出處"></h1>
  <p class="lede" style="max-width:62ch"
     data-en="A judge who hears a number with a unit and a source believes the next thing you say."
     data-zh="評審聽到一個有單位、有出處的數字之後，就會相信你接下來說的話。"></p>
</header>

<section class="wrap" id="ten">
  <div class="sec-head">
    <h2 data-en="The ten that carry the session" data-zh="撐起整場的十個數字"></h2>
    <p data-en="If you remember nothing else, remember these with their units."
       data-zh="如果其他都忘了，至少把這些連單位一起記住。"></p>
  </div>
  <div class="top10" id="tenlist"></div>
</section>

<div class="bar">
  <div class="wrap">
    <input class="search" id="q" type="search" autocomplete="off"
           data-ph-en="Search facts: membrane, R², ELISA, cost, farmers…"
           data-ph-zh="搜尋事實：薄膜、R²、ELISA、成本、農民……">
    <div class="bar-row">
      <div class="chips" id="doms"></div>
      <span class="count-l" id="count"></span>
      <div class="ftools"><button class="ftool" id="openall" data-en="Open all" data-zh="全部展開"></button><button class="ftool" id="shutall" data-en="Close all" data-zh="全部收合"></button></div>
    </div>
  </div>
</div>

<section class="wrap" style="padding-top:1.5rem">
  <div id="out"></div>
  <p class="note" id="empty" hidden
     data-en="Nothing matches. Try a shorter word, or the name of a wiki page."
     data-zh="沒有符合的結果。試試更短的詞，或是 wiki 頁面的名稱。"></p>
</section>

<section class="wrap" id="gaps">
  <div class="sec-head">
    <h2 data-en="The honest list" data-zh="誠實清單"></h2>
    <p data-en="Places where your own pages disagree, or say more than the data shows. Each one has a sentence you can say out loud, and saying it first is worth more than hoping nobody looks."
       data-zh="你們的頁面彼此矛盾、或說得比數據更多的地方。每一條都附一句可以直接講出來的話；先講出來，比期待沒人發現有價值得多。"></p>
  </div>
  <div class="chips" id="gdoms" style="margin-bottom:1.25rem"></div>
  <div class="grid" id="glist" style="gap:.75rem"></div>
</section>

<script src="assets/js/site.js?v=202610300100"></script>
<script src="data/meta.js?v=202610300100"></script>
<script src="data/facts.js?v=202610300100"></script>
<script src="data/gaps.js?v=202610300100"></script>
<script src="data/ten.js?v=202610300100"></script>
<script>
(function () {
  var S = window.Site;
  var qEl = document.getElementById('q');
  var state = { q: '', dom: 'all', gdom: 'all' };

  function domName(id) {
    for (var i = 0; i < META.domains.length; i++) if (META.domains[i].id === id) return S.p({ en: META.domains[i].en, zh: META.domains[i].zh });
    return id;
  }

  function hay(f) {
    return [f.label_en, f.label_zh, f.value, f.detail_en, f.detail_zh, f.src, f.dom].join(' ').toLowerCase();
  }

  function mark(text, q) {
    var t = S.esc(text);
    if (!q) return t;
    try {
      return t.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
    } catch (e) { return t; }
  }

  function row(f, cls) {
    var conf = f.confidence === 'conflict' ? '<span class="pill pill-w">' +
      (S.lang === 'zh' ? '頁面不一致' : 'pages disagree') + '</span>' : '';
    var det = S.t(f, 'detail');
    var open = !!state.q;
    return '<div class="fitem ' + (cls || '') + (f.confidence === 'conflict' ? ' conflict' : '') + '">' +
      '<button class="fact" type="button" aria-expanded="' + open + '">' +
        '<span class="f-lab">' + mark(S.t(f, 'label'), state.q) + '</span>' +
        '<span class="f-val">' + mark(f.value, state.q) + '</span>' +
        '<span class="f-more" aria-hidden="true">+</span>' +
      '</button>' +
      '<div class="f-det"' + (open ? '' : ' hidden') + '>' +
        (det ? mark(det, state.q) : '') +
        '<div class="foot"><span class="pill">' + S.esc(domName(f.dom)) + '</span>' + conf + S.srcLink(f.src) + '</div>' +
      '</div></div>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('.fact'); if (!b) return;
    var open = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!open));
    var d = b.nextElementSibling;
    if (d) d.hidden = open;
  });

  function drawTen() {
    var ids = (window.TEN || []);
    var byId = {}, i;
    for (i = 0; i < FACTS.length; i++) byId[FACTS[i].id] = FACTS[i];
    var h = '';
    for (i = 0; i < ids.length; i++) {
      var f = byId[ids[i]];
      if (f) h += row(f, 'star');
    }
    document.getElementById('tenlist').innerHTML = h ||
      '<p class="lede-sm">' + (S.lang === 'zh' ? '尚未挑選。' : 'Not chosen yet.') + '</p>';
  }

  function drawChips() {
    var counts = {}, i;
    for (i = 0; i < FACTS.length; i++) counts[FACTS[i].dom] = (counts[FACTS[i].dom] || 0) + 1;
    var h = '<button class="chip" data-d="all" aria-pressed="' + (state.dom === 'all') + '">' +
      (S.lang === 'zh' ? '全部' : 'All') + '<span class="c">' + FACTS.length + '</span></button>';
    for (i = 0; i < META.domains.length; i++) {
      var d = META.domains[i];
      if (!counts[d.id]) continue;
      h += '<button class="chip" data-d="' + d.id + '" aria-pressed="' + (state.dom === d.id) + '">' +
        S.esc(S.p({ en: d.en, zh: d.zh })) + '<span class="c">' + counts[d.id] + '</span></button>';
    }
    document.getElementById('doms').innerHTML = h;
  }

  function drawList() {
    var q = state.q.toLowerCase().trim();
    var groups = {}, order = [], shown = 0, i;
    for (i = 0; i < FACTS.length; i++) {
      var f = FACTS[i];
      if (state.dom !== 'all' && f.dom !== state.dom) continue;
      if (q && hay(f).indexOf(q) < 0) continue;
      if (!groups[f.dom]) { groups[f.dom] = []; order.push(f.dom); }
      groups[f.dom].push(f); shown++;
    }
    var h = '';
    for (i = 0; i < order.length; i++) {
      var g = groups[order[i]];
      h += '<div class="fact-group"><h3>' + S.esc(domName(order[i])) +
           ' <span class="c">' + g.length + '</span></h3><div class="flist">';
      for (var j = 0; j < g.length; j++) h += row(g[j]);
      h += '</div></div>';
    }
    document.getElementById('out').innerHTML = h;
    document.getElementById('empty').hidden = shown > 0;
    document.getElementById('count').textContent = S.lang === 'zh'
      ? shown + ' / ' + FACTS.length + ' 條' : shown + ' of ' + FACTS.length;
  }

  function toggleAll(open) {
    var bs = document.querySelectorAll('#out .fact'), i;
    for (i = 0; i < bs.length; i++) {
      bs[i].setAttribute('aria-expanded', String(open));
      if (bs[i].nextElementSibling) bs[i].nextElementSibling.hidden = !open;
    }
  }
  document.getElementById('openall').addEventListener('click', function () { toggleAll(true); });
  document.getElementById('shutall').addEventListener('click', function () { toggleAll(false); });

  function drawGaps() {
    var counts = {}, i;
    for (i = 0; i < GAPS.length; i++) counts[GAPS[i].dom] = (counts[GAPS[i].dom] || 0) + 1;
    var ch = '<button class="chip" data-g="all" aria-pressed="' + (state.gdom === 'all') + '">' +
      (S.lang === 'zh' ? '全部' : 'All') + '<span class="c">' + GAPS.length + '</span></button>';
    for (i = 0; i < META.domains.length; i++) {
      var d = META.domains[i];
      if (!counts[d.id]) continue;
      ch += '<button class="chip" data-g="' + d.id + '" aria-pressed="' + (state.gdom === d.id) + '">' +
        S.esc(S.p({ en: d.en, zh: d.zh })) + '<span class="c">' + counts[d.id] + '</span></button>';
    }
    document.getElementById('gdoms').innerHTML = ch;

    var h = '';
    for (i = 0; i < GAPS.length; i++) {
      var g = GAPS[i];
      if (state.gdom !== 'all' && g.dom !== state.gdom) continue;
      h += '<div class="gap-card"><h4>' + S.esc(S.t(g, 'issue')) + '</h4>' +
        '<div class="bot" style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center">' +
        '<span class="pill pill-w">' + S.esc(domName(g.dom)) + '</span>' +
        (g.where ? '<span class="src">' + S.esc(g.where) + '</span>' : '') + '</div>' +
        '<div class="say"><b>' + (S.lang === 'zh' ? '可以這樣說' : 'Say this') + '</b>' +
        S.esc(S.t(g, 'say')) + '</div></div>';
    }
    document.getElementById('glist').innerHTML = h;
  }

  qEl.addEventListener('input', function () { state.q = qEl.value; drawList(); });
  document.getElementById('doms').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state.dom = b.getAttribute('data-d'); drawChips(); drawList();
  });
  document.getElementById('gdoms').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state.gdom = b.getAttribute('data-g'); drawGaps();
  });

  function draw() { drawTen(); drawChips(); drawList(); drawGaps(); }
  S.onLang(draw);
})();
</script>
</body>
</html>
