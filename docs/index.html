<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReLEAF Judging Trainer · GEMS Taiwan iGEM 2026</title>
<meta name="description" content="Twenty minutes of questions, seven students, one wiki. Preparation for the GEMS Taiwan judging session at the iGEM 2026 Grand Jamboree.">
<link rel="stylesheet" href="assets/css/base.css?v=202610291900">
<link rel="stylesheet" href="assets/css/pages.css?v=202610291900">
<link rel="stylesheet" href="assets/css/theme.css?v=202610291900">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%2300B87A'/%3E%3C/svg%3E">
<style>
.sheet { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.hero .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1.75rem; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
         background: var(--rule); border-radius: var(--r-lg); overflow: hidden; margin: -34px 0 0; position: relative; z-index: 2;
         box-shadow: 0 10px 30px rgba(0, 6, 28, .10); }
.facts div { background: #fff; padding: 16px 18px; }
.facts dt { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 0 0 5px; }
.facts dd { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.35; font-variant-numeric: tabular-nums; }
.facts dd small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }

.band { padding: 3rem 0 0; }
.band h2 { font-size: clamp(22px, 2.4vw, 30px); font-weight: 700; margin: 0 0 .4rem; }
.band .sub { color: var(--muted); margin: 0 0 1.4rem; max-width: 62ch; }

.feature { position: relative; overflow: hidden; background: var(--navy); color: #fff;
           border-radius: var(--r-lg); padding: 30px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: center; }
.feature::after { content: ""; position: absolute; width: 460px; height: 460px; right: -170px; top: -210px;
                  border-radius: 50%; filter: blur(85px); opacity: .5; pointer-events: none;
                  background: radial-gradient(circle, #0167EF 0%, transparent 65%); }
.feature > * { position: relative; z-index: 1; }
.feature h3 { font-size: clamp(22px, 2.3vw, 30px); font-weight: 700; line-height: 1.2; margin: 10px 0 10px; }
.feature h3 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.feature p { color: rgba(255, 255, 255, .72); margin: 0 0 18px; }
.feature .kick { font-size: 13px; font-weight: 600; color: var(--jb-green-2); }
.fstats { display: flex; gap: 22px; margin: 0 0 20px; }
.fstats b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.fstats span { font-size: 12.5px; color: rgba(255, 255, 255, .55); }
.fshots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fshots img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; display: block; border: 1px solid rgba(255, 255, 255, .12); }

.rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.room { background: #fff; border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 18px 20px;
        text-decoration: none; color: inherit; display: block; transition: border-color .2s, transform .2s; }
.room:hover { border-color: rgba(0, 0, 0, .22); transform: translateY(-2px); text-decoration: none; }
.room .n { font-size: 12px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
.room h3 { font-size: 17px; font-weight: 600; margin: 6px 0 5px; }
.room p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0; }

.drills { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.drill { background: #fff; border: 1px solid var(--rule); border-left: 3px solid var(--c, var(--jb-blue));
         border-radius: 0 var(--r) var(--r) 0; padding: 15px 17px; text-decoration: none; color: inherit; display: block; }
.drill:hover { background: var(--paper-3); text-decoration: none; }
.drill b { display: block; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c); line-height: 1; }
.drill h4 { font-size: 15px; font-weight: 600; margin: 7px 0 4px; }
.drill p { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.5; }

.rules { list-style: none; padding: 0; margin: 0; counter-reset: r;
         display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.rules li { counter-increment: r; background: #fff; border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 18px 20px; }
.rules li::before { content: counter(r); display: block; font-size: 12px; font-weight: 700; color: var(--jb-green); font-variant-numeric: tabular-nums; }
.rules h4 { font-size: 16px; font-weight: 600; margin: 6px 0 6px; line-height: 1.4; }
.rules p { font-size: 14px; color: var(--muted); line-height: 1.6; margin: 0; }

.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 1px;
          background: var(--rule); border-radius: var(--r-lg); overflow: hidden; }
.counts div { background: #fff; padding: 16px 14px; text-align: center; }
.counts b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.counts span { font-size: 12.5px; color: var(--muted); }

@media (max-width: 860px) { .feature { grid-template-columns: 1fr; } .facts { margin-top: -20px; } }
</style>
</head>
<body>

<header class="hero">
  <p class="ticket">
    <span class="dot" aria-hidden="true"></span>
    <span data-en="Grand Jamboree · Paris · 13–16 Nov 2026" data-zh="Grand Jamboree · 巴黎 · 2026 年 11 月 13–16 日"></span>
    <span class="stub">J03</span>
  </p>
  <p class="eyebrow" style="margin-top:1.25rem" data-en="GEMS Taiwan · iGEM 2026 · Biomanufacturing Village" data-zh="GEMS Taiwan · iGEM 2026 · 生物製造村"></p>
  <h1 data-en="Twenty minutes of questions." data-zh="二十分鐘的提問。"></h1>
  <h1 class="h1-muted" data-en="Seven of you at the microphone." data-zh="七個人站在麥克風前。"></h1>
  <p class="lede" style="max-width:52ch;margin-top:1.1rem"
     data-en="The judges have read your wiki. They are there to find out whether you understand it."
     data-zh="評審已經讀過你們的 wiki。他們來，是要確認你們是不是真的懂它。"></p>
  <div class="btn-row">
    <a class="btn btn-ghost" href="map.html" data-en="Open the knowledge map" data-zh="打開知識地圖"></a>
    <a class="btn btn-line" href="mock.html" data-en="Enter the mock room" data-zh="進入模擬會場"></a>
    <a class="btn btn-line" href="seats.html" data-en="Find your seat" data-zh="找到你的位置"></a>
  </div>
</header>

<main class="sheet">

  <dl class="facts">
    <div><dt data-en="When" data-zh="時間"></dt><dd>Fri 13 Nov<small data-en="12:00–12:25 Paris · 19:00–19:25 Taipei" data-zh="巴黎 12:00–12:25 · 台北 19:00–19:25"></small></dd></div>
    <div><dt data-en="Room" data-zh="會場"></dt><dd>J03<small data-en="first shift of the day" data-zh="當天第一場"></small></dd></div>
    <div><dt data-en="Arrive" data-zh="報到"></dt><dd>11:30–11:50<small data-en="Judging Zone" data-zh="評審區"></small></dd></div>
    <div><dt data-en="Shape" data-zh="形式"></dt><dd data-en="5 min + 20 min" data-zh="5 分鐘 + 20 分鐘"><small data-en="update, then questions" data-zh="先報告，再提問"></small></dd></div>
    <div><dt data-en="Judges" data-zh="評審"></dt><dd>4<small data-en="all in the room" data-zh="全部在現場"></small></dd></div>
    <div><dt data-en="Nominated" data-zh="提名"></dt><dd data-en="3 awards" data-zh="三個獎項"><small data-en="Measurement · Hardware · Integrated HP" data-zh="量測 · 硬體 · 整合人文實踐"></small></dd></div>
  </dl>

  <section class="band">
    <div class="feature">
      <div>
        <span class="kick" data-en="New" data-zh="新"></span>
        <h3><span data-en="Evidence on the rim." data-zh="證據在外圈。"></span>
            <em data-en="Impact at the core." data-zh="影響在中心。"></em></h3>
        <p data-en="Sixty nodes on three shells, turned by hand. Every cross-domain hop passes through a concept, and every card carries its number, its n, its control, and the boundary where it fails."
           data-zh="三層殼、六十個節點，可以用手轉動。每一次跨領域的跳躍都要穿過一個概念；每張卡片都帶著它的數字、n、對照，以及它失敗的邊界。"></p>
        <div class="fstats">
          <div><b class="tw">60</b><span data-en="nodes" data-zh="節點"></span></div>
          <div><b class="tw">77</b><span data-en="written links" data-zh="寫下的連結"></span></div>
          <div><b class="tw">116</b><span data-en="figures in the cards" data-zh="卡片裡的圖"></span></div>
        </div>
        <a class="btn btn-grad" href="map.html" data-en="Turn the map" data-zh="轉動地圖"></a>
      </div>
      <div class="fshots">
        <img loading="lazy" src="assets/img/fq/h03.webp" alt="">
        <img loading="lazy" src="assets/img/tl/r17-set6-plates-plant.webp" alt="">
        <img loading="lazy" src="assets/img/fq/m01.svg" alt="">
        <img loading="lazy" src="assets/img/fq/i01.webp" alt="">
      </div>
    </div>
  </section>

  <section class="band">
    <h2 data-en="Four ways to be tested" data-zh="四種被考的方式"></h2>
    <p class="sub" data-en="Each one opens the mock room already filtered." data-zh="每一個都會直接打開已經篩選好的模擬會場。"></p>
    <div class="drills" id="drills"></div>
  </section>

  <section class="band">
    <h2 data-en="The rooms" data-zh="各個房間"></h2>
    <p class="sub" data-en="Left to right: build what you know, then test it, then decide who says it."
       data-zh="由左到右：先建立你知道的，再測試它，最後決定由誰來說。"></p>
    <div class="rooms" id="rooms"></div>
  </section>

  <section class="band">
    <h2 data-en="Five things that decide this session" data-zh="決定這二十分鐘的五件事"></h2>
    <p class="sub" data-en="Read these once a day until you fly." data-zh="每天讀一次，讀到出發為止。"></p>
    <ol class="rules" id="rules"></ol>
  </section>

  <section class="band" style="padding-bottom:3rem">
    <h2 data-en="What is in here" data-zh="這裡有什麼"></h2>
    <p class="sub" data-en="All of it off your own frozen wiki. Where your pages disagree, this site says so."
       data-zh="全部取自你們自己凍結的 wiki。頁面互相矛盾的地方，這個網站會直接講出來。"></p>
    <div class="counts" id="counts"></div>
  </section>

</main>

<script src="assets/js/site.js?v=202610291900"></script>
<script src="data/content.js?v=202610291900"></script>
<script src="data/index.js?v=202610291900"></script>
<script>
(function () {
  var S = window.Site;

  var MAPTILE = {
    href: 'map.html', title_en: 'Knowledge Map', title_zh: '知識地圖',
    blurb_en: 'Three shells in 3D. Evidence, the concepts that join domains, and impact at the core — each card with its figures, its n and its boundary.',
    blurb_zh: '三層殼的 3D 地圖。證據、連接領域的概念，以及中心的影響——每張卡片都附上它的圖、它的 n 與它的邊界。'
  };

  function rooms() {
    var list = [MAPTILE].concat(CONTENT.tiles), h = '';
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      h += '<a class="room" href="' + t.href + '">' +
        '<span class="n">' + ('0' + (i + 1)).slice(-2) + '</span>' +
        '<h3>' + S.esc(S.t(t, 'title')) + '</h3>' +
        '<p>' + S.esc(S.t(t, 'blurb')) + '</p></a>';
    }
    document.getElementById('rooms').innerHTML = h;
  }

  function drills() {
    var c = window.INDEX_COUNTS || {}, zh = S.lang === 'zh';
    var rows = [
      { n: c.deep || 0, href: 'mock.html?mode=deep', col: '#00B87A',
        en: 'Deep end', zh: '深水區',
        pen: 'Mechanism, trade-offs, numbers with their uncertainty.',
        pzh: '機制、取捨，以及帶著不確定性的數字。' },
      { n: c.reason || 0, href: 'mock.html?type=reason', col: '#0167EF',
        en: 'Reasoning, not recall', zh: '推理題，不是背題',
        pen: 'No answer on the wiki. You work it out standing up.',
        pzh: 'Wiki 上沒有答案。你要站著把它推出來。' },
      { n: c.history || 0, href: 'mock.html?type=history', col: '#00A3C4',
        en: 'Where we stand', zh: '我們站在哪裡',
        pen: 'Hollow fibre is old news. What did we actually add?',
        pzh: '中空纖維不是新東西。那我們到底加了什麼？' },
      { n: c.authored || 0, href: 'mock.html?mode=kyle', col: '#F08C00',
        en: "The adviser's set", zh: '顧問出的題',
        pen: 'Kyle Peng’s scientific inquiries, answered honestly.',
        pzh: 'Kyle Peng 的科學問題，誠實作答。' }
    ];
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      h += '<a class="drill" style="--c:' + r.col + '" href="' + r.href + '">' +
        '<b>' + r.n + '</b><h4>' + S.esc(zh ? r.zh : r.en) + '</h4>' +
        '<p>' + S.esc(zh ? r.pzh : r.pen) + '</p></a>';
    }
    document.getElementById('drills').innerHTML = h;
  }

  function rules() {
    var h = '';
    for (var i = 0; i < CONTENT.rules.length; i++) {
      var r = CONTENT.rules[i];
      h += '<li><h4>' + S.esc(S.t(r, 'head')) + '</h4><p>' + S.esc(S.t(r, 'body')) + '</p></li>';
    }
    document.getElementById('rules').innerHTML = h;
  }

  function counts() {
    var c = window.INDEX_COUNTS || {}, zh = S.lang === 'zh';
    var rows = [
      [c.facts, 'facts', '事實'], [c.terms, 'terms', '術語'], [c.questions, 'questions', '題目'],
      [c.figures, 'figures', '圖'], [41, 'Registry parts', 'Registry parts'], [c.gaps, 'honest gaps', '誠實的缺口']
    ];
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      h += '<div><b>' + (rows[i][0] || 0) + '</b><span>' + S.esc(zh ? rows[i][2] : rows[i][1]) + '</span></div>';
    }
    document.getElementById('counts').innerHTML = h;
  }

  function all() { rooms(); drills(); rules(); counts(); }
  S.onLang(all);
  all();
})();
</script>
</body>
</html>
