<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Year in Evidence · ReLEAF Judging Trainer</title>
<link rel="stylesheet" href="assets/css/base.css?v=202610300100">
<link rel="stylesheet" href="assets/css/pages.css?v=202610300100">
<link rel="stylesheet" href="assets/css/theme.css?v=202610300100">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20c0-8 5.5-14.5 16-15.5C19.5 14 14 20 4 20Z' fill='%231a7f45'/%3E%3C/svg%3E">
</head>
<body>

<header class="hero wrap narrow">
  <p class="eyebrow" data-en="08 · The Year in Evidence" data-zh="08 · 一年的證據"></p>
  <h1 data-en="What happened, and when" data-zh="什麼時候，發生了什麼"></h1>
  <p class="lede"
     data-en="Judges ask when things happened more often than teams expect, because the order of events is how they tell a real project from a written one."
     data-zh="評審問「這是什麼時候做的」比隊伍預期的多，因為事件的先後順序，是他們分辨真實專題與寫出來的專題的方式。"></p>
</header>

<section class="wrap narrow" style="padding-top:0">
  <details class="d">
    <summary><span data-en="How to use this" data-zh="怎麼用這一頁"></span></summary>
    <ul style="padding-left:1.1rem;margin:.6rem 0 0;font-size:.9375rem;color:var(--ink-2);line-height:1.6">
      <li data-en="Learn the month, not the date. “Early September” is a confident answer; a wrong exact date is not." data-zh="記月份，不要記日期。「九月初」是有把握的回答；講錯確切日期則不是。"></li>
      <li data-en="Know which three came last. Judges often ask what is most recent, and the answer sits at the bottom of this page." data-zh="知道最後三件事是什麼。評審常問最近的進展，答案就在這一頁的最下面。"></li>
      <li data-en="For each picture, be able to say what it is evidence of, not what it shows." data-zh="每一張圖，你要能說出它證明了什麼，而不是它看起來是什麼。"></li>
      <li data-en="A date with a tilde and an amber dot was worked out from context, because the wiki does not date that figure. The note under it says how. Never give one of those to a judge as an exact date." data-zh="日期前面有波浪號、圓點是琥珀色的，表示那個日期是從前後文推估的，因為 wiki 沒有標日期。下面的小字說明推估依據。絕對不要把那種日期當成確切日期講給評審聽。"></li>
    </ul>
  </details>
</section>

<div class="bar">
  <div class="wrap narrow">
    <div class="bar-row">
      <div class="chips" id="tracks"></div>
      <span class="count-l" id="count"></span>
    </div>
  </div>
</div>

<section class="wrap narrow" style="padding-top:1.25rem">
  <div class="year" id="year"></div>
  <div class="rail" id="rail"></div>
</section>

<section class="wrap narrow">
  <div class="note"
       data-en="Figures are the team's own, from the frozen wiki, and each caption links to the page it lives on. If a judge wants a closer look at one, open that wiki page on the shared screen rather than describing it."
       data-zh="圖都是隊上自己的，來自凍結後的 wiki，每張說明都連回它所在的頁面。評審想細看時，直接在分享螢幕上打開那一頁，不要用講的。"></div>
</section>

<script src="assets/js/site.js?v=202610300100"></script>
<script src="data/timeline.js?v=202610300100"></script>
<script>
(function () {
  var S = window.Site;
  var TRACKS = [
    { id: 'all', en: 'Everything', zh: '全部' },
    { id: 'w', en: 'Wet lab', zh: '濕式實驗' },
    { id: 'l', en: 'Plants', zh: '植物' },
    { id: 'h', en: 'Hardware', zh: '硬體' },
    { id: 'd', en: 'Models & software', zh: '模型與軟體' },
    { id: 'p', en: 'People & field', zh: '人與現場' }
  ];
  var MON = {
    en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    zh: ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']
  };
  var cur = 'all';

  function trackName(id) {
    for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === id) return S.p({ en: TRACKS[i].en, zh: TRACKS[i].zh });
    return id;
  }

  function list() {
    var out = [];
    for (var i = 0; i < TIMELINE.length; i++) {
      if (cur === 'all' || TIMELINE[i].track === cur) out.push(TIMELINE[i]);
    }
    out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    return out;
  }

  function drawChips() {
    var counts = {}, i;
    for (i = 0; i < TIMELINE.length; i++) counts[TIMELINE[i].track] = (counts[TIMELINE[i].track] || 0) + 1;
    var h = '';
    for (i = 0; i < TRACKS.length; i++) {
      var t = TRACKS[i];
      var n = t.id === 'all' ? TIMELINE.length : (counts[t.id] || 0);
      if (!n) continue;
      h += '<button class="chip" data-t="' + t.id + '" aria-pressed="' + (cur === t.id) + '">' +
        S.esc(S.p({ en: t.en, zh: t.zh })) + '<span class="c">' + n + '</span></button>';
    }
    document.getElementById('tracks').innerHTML = h;
  }

  function drawYear() {
    var items = list(), byMon = {}, i;
    for (i = 0; i < items.length; i++) {
      var m = items[i].date.slice(0, 7);
      (byMon[m] = byMon[m] || []).push(items[i]);
    }
    var months = [];
    for (i = 1; i <= 9; i++) months.push('2026-' + (i < 10 ? '0' : '') + (i + 1));
    var h = '';
    for (i = 0; i < months.length; i++) {
      var g = byMon[months[i]] || [];
      var bars = '';
      for (var j = 0; j < g.length; j++) {
        bars += '<i style="height:' + (g[j].key ? 22 : 12) + 'px"></i>';
      }
      var mi = parseInt(months[i].slice(5), 10) - 1;
      h += '<a href="#m-' + months[i] + '"><span class="bars">' + (bars || '<i style="height:2px"></i>') + '</span>' +
        S.esc(S.p({ en: MON.en[mi].slice(0, 3), zh: MON.zh[mi] })) + '</a>';
    }
    document.getElementById('year').innerHTML = h;
  }

  function drawRail() {
    var items = list(), h = '', lastMon = '';
    for (var i = 0; i < items.length; i++) {
      var m = items[i].date;
      var mon = m.slice(0, 7);
      if (mon !== lastMon) {
        lastMon = mon;
        var mi = parseInt(mon.slice(5), 10) - 1;
        h += '<div class="month" id="m-' + mon + '"><h3>' +
          S.esc(S.p({ en: MON.en[mi] + ' 2026', zh: '2026 年 ' + MON.zh[mi] })) +
          '</h3><div class="ln"></div></div>';
      }
      h += row(items[i]);
    }
    document.getElementById('rail').innerHTML = h;
    document.getElementById('count').textContent = S.lang === 'zh'
      ? items.length + ' 個里程碑' : items.length + ' milestones';
  }

  function dayLabel(it) {
    var iso = it.date, d = iso.slice(8), mi = parseInt(iso.slice(5, 7), 10) - 1;
    var s = S.lang === 'zh' ? (mi + 1) + '/' + parseInt(d, 10)
      : MON.en[mi].slice(0, 3) + ' ' + parseInt(d, 10);
    return it.approx ? '~' + s : s;
  }

  function row(it) {
    var fig = '';
    if (it.img) {
      var src = /^(https?:|assets\/)/.test(it.img) ? it.img : (window.IMG || 'assets/img/tl/') + it.img;
      fig = '<figure><img src="' + S.esc(src) + '" alt="' + S.esc(S.t(it, 'alt') || S.t(it, 't')) +
        '" loading="lazy" decoding="async">' +
        (S.t(it, 'cap') ? '<figcaption>' + S.esc(S.t(it, 'cap')) +
          (it.page ? ' · <a href="' + S.wiki(it.page) + '" target="_blank" rel="noopener">' +
            S.esc(it.page) + ' ↗</a>' : '') + '</figcaption>' : '') +
        '</figure>';
    }
    var tags = '<span class="pill">' + S.esc(trackName(it.track)) + '</span>';
    if (it.key) tags += '<span class="pill pill-a">' + (S.lang === 'zh' ? '常被問' : 'often asked') + '</span>';
    if (it.approx) tags += '<span class="pill pill-w">' + (S.lang === 'zh' ? '日期為推估' : 'date approximate') + '</span>';
    if (it.page && !it.img) tags += S.srcLink(it.page);
    var basis = it.approx && S.t(it, 'when')
      ? '<p class="basis">' + S.esc(S.t(it, 'when')) + '</p>' : '';
    return '<article class="ms' + (it.key ? ' key' : '') + (it.approx ? ' approx' : '') + '">' +
      '<span class="dot"></span>' +
      '<p class="date">' + S.esc(dayLabel(it)) + '</p>' +
      '<div class="body"><h4>' + S.esc(S.t(it, 't')) + '</h4>' +
      '<p class="proves">' + S.esc(S.t(it, 'p')) + '</p>' +
      '<div class="tags">' + tags + '</div>' + basis + fig + '</div></article>';
  }

  document.getElementById('tracks').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    cur = b.getAttribute('data-t');
    drawChips(); drawYear(); drawRail();
  });

  S.onLang(function () { drawChips(); drawYear(); drawRail(); });
})();
</script>
</body>
</html>
